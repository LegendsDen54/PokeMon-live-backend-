<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private CCN report transfer</title><style>body{max-width:640px;margin:40px auto;padding:20px;font:16px system-ui;background:#06111f;color:#eee}label{display:block;margin:16px 0 6px}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px}textarea{height:220px}button{margin-top:16px}</style><h1>Private CCN report transfer</h1><p>Transfer an actual stock-checker response. This does not query Discord or manufacture inventory.</p><label for="key">Existing sensor pairing key</label><input id="key" type="password" autocomplete="off"><label for="report">Prepared report</label><textarea id="report" aria-label="Prepared CCN report"></textarea><button id="save">SAVE CHECK RESULT</button><p id="status" role="status"></p><button id="dgPending">LOAD PENDING DOLLAR GENERAL CHECKS</button><pre id="dgQueue" style="white-space:pre-wrap" aria-live="polite"></pre><a href="/">Return to monitor</a><script>
const key=document.getElementById('key');key.value=sessionStorage.getItem('ccnReportKey') || '';
document.getElementById('save').addEventListener('click',async()=>{
  const status=document.getElementById('status');const button=document.getElementById('save');button.disabled=true;
  try{
    if(!key.value.trim())throw new Error('Enter the existing sensor pairing key.');
    const prepared=document.getElementById('report').value.trim();
    if(!prepared)throw new Error('The prepared report is empty. An actual Discord result must be prepared before saving.');
    let report;try{report=JSON.parse(prepared);}catch{throw new Error('The prepared report is incomplete or invalid. Please use a complete prepared report.');}
    const response=await fetch(report.kind==='news'?'/api/ccn/news-report':'/api/ccn/inventory-report',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key.value.trim()},body:JSON.stringify(report)});
    let data;try{data=await response.json();}catch{throw new Error('The monitor returned an incomplete response. Keep this report and try again after the connection recovers.');}if(!response.ok || !data.ok)throw new Error(data.error || 'Report could not be saved');
    await fetch('/api/ccn/viewer-session',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()}});sessionStorage.setItem('ccnReportKey',key.value.trim());status.textContent='Saved actual check result. The monitor will show it on its next update.';
  }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
});
document.getElementById('dgPending').onclick=async()=>{const out=document.getElementById('dgQueue');try{const r=await fetch('/api/dollargeneral/pending-checks',{headers:{Authorization:'Bearer '+key.value.trim()},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error || 'Authorized source connection required');out.textContent=JSON.stringify(d,null,2);}catch(e){out.textContent=e.message;}};
</script></html>
