<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private CCN report transfer</title><style>body{max-width:640px;margin:40px auto;padding:20px;font:16px system-ui;background:#06111f;color:#eee}label{display:block;margin:16px 0 6px}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px}textarea{height:220px}button{margin-top:16px}</style><h1>Private CCN report transfer</h1><p>Transfer an actual stock-checker response. This does not query Discord or manufacture inventory.</p><label for="key">Existing sensor pairing key</label><input id="key" type="password" autocomplete="off"><label for="report">Prepared report</label><textarea id="report" aria-label="Prepared CCN report"></textarea><button id="connectOwner">CONNECT OWNER COLLECTOR</button><p id="ownerStatus" role="status"></p><button id="save">SAVE CHECK RESULT</button><p id="status" role="status"></p><button id="dgPending">LOAD PENDING INVENTORY CHECKS</button><button id="notificationAudit">CHECK SEARCH NOTIFICATION STATUS</button><pre id="notificationAuditResult" style="white-space:pre-wrap" aria-live="polite"></pre><pre id="dgQueue" style="white-space:pre-wrap" aria-live="polite"></pre><a href="/">Return to monitor</a><script>
const key=document.getElementById('key');key.value=sessionStorage.getItem('ccnReportKey') || '';
let ownerConnected=false;
async function ownerState(){try{const r=await fetch('/api/inventory/owner-session',{cache:'no-store'});const d=await r.json();ownerConnected=d.connected===true;}catch{ownerConnected=false;}document.getElementById('ownerStatus').textContent=ownerConnected?'Owner collector connected. This browser can save checker responses without re-entering the key.':'Owner collector needs a one-time connection.';}
document.getElementById('connectOwner').onclick=async()=>{try{if(!key.value.trim())throw Error('Enter the existing owner pairing key once.');const r=await fetch('/api/inventory/owner-session',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()}});if(!r.ok)throw Error('Owner connection failed. Check the existing key.');await fetch('/api/ccn/viewer-session',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()}});key.value='';sessionStorage.removeItem('ccnReportKey');await ownerState();}catch(e){document.getElementById('ownerStatus').textContent=e.message;}};
ownerState();
document.getElementById('save').addEventListener('click',async()=>{
  const status=document.getElementById('status');const button=document.getElementById('save');button.disabled=true;
  try{
    if(!key.value.trim() && !ownerConnected)throw new Error('Connect the owner collector once before saving.');
    const prepared=document.getElementById('report').value.trim();
    if(!prepared)throw new Error('The prepared report is empty. An actual Discord result must be prepared before saving.');
    let report;try{report=JSON.parse(prepared);}catch{throw new Error('The prepared report is incomplete or invalid. Please use a complete prepared report.');}
    const response=await fetch(report.kind==='cooldown'?'/api/inventory/checker-cooldown':report.kind==='news'?'/api/ccn/news-report':'/api/ccn/inventory-report',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key.value.trim()},body:JSON.stringify(report)});
    let data;try{data=await response.json();}catch{throw new Error('The monitor returned an incomplete response. Keep this report and try again after the connection recovers.');}if(!response.ok || !data.ok)throw new Error(data.error || 'Report could not be saved');
    if(key.value.trim()){await fetch('/api/ccn/viewer-session',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()}});await fetch('/api/inventory/owner-session',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()}});key.value='';sessionStorage.removeItem('ccnReportKey');await ownerState();}status.textContent=report.kind==='cooldown'?'Saved checker cooldown. The app will update its countdown.':'Saved actual check result. The monitor will show it on its next update.';
  }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
});
document.getElementById('dgPending').onclick=async()=>{const out=document.getElementById('dgQueue');try{const r=await fetch('/api/inventory/pending-checks',{headers:{Authorization:'Bearer '+key.value.trim()},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error || 'Authorized source connection required');out.textContent=JSON.stringify(d,null,2);}catch(e){out.textContent=e.message;}};
document.getElementById('notificationAudit').onclick=async()=>{const out=document.getElementById('notificationAuditResult');try{const r=await fetch('/api/inventory/owner-notification-status',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error || 'Owner collector required');out.textContent=JSON.stringify(d,null,2);}catch(e){out.textContent=e.message;}};
</script></html>
