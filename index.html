<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#020711">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="Pokémon Monitor"
>

<link
  rel="manifest"
  href="/manifest.webmanifest"
>

<link
  rel="apple-touch-icon"
  sizes="512x512"
  href="/app-icon.png"
>

<title>Pokémon Restock Monitor</title>

<style>

:root{
  --bg:#020711;
  --panel:#071326;
  --panel2:#0a1b31;
  --text:#f7fbff;
  --muted:#96a8bf;
  --green:#54f3a6;
  --blue:#62c7ff;
  --gold:#ffc76b;
  --red:#ff758b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:max(90px,env(safe-area-inset-bottom));
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  overflow:hidden;
}


/* HERO */

.hero{
  height:285px;
  position:relative;

  background:
    linear-gradient(
      to bottom,
      rgba(2,7,17,.03) 0%,
      rgba(2,7,17,.12) 55%,
      rgba(2,7,17,.88) 92%,
      #020711 100%
    ),
    url("/hero.jpg")
    center top / cover no-repeat;
}


/* STATUS */

.connection-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 14px;
  margin-top:-16px;
  position:relative;
  z-index:5;
}

.connection-card{
  min-height:68px;
  border:1px solid rgba(84,243,166,.55);
  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      rgba(6,52,43,.98),
      rgba(4,32,34,.98)
    );

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:10px;

  text-align:left;
}

.connection-card.push{
  border-color:rgba(255,199,107,.55);

  background:
    linear-gradient(
      135deg,
      rgba(67,48,14,.98),
      rgba(43,32,13,.98)
    );

  appearance:none;
  -webkit-appearance:none;
}

.connection-card.push.active{
  border-color:rgba(84,243,166,.55);

  background:
    linear-gradient(
      135deg,
      rgba(6,52,43,.98),
      rgba(4,32,34,.98)
    );
}

.connection-card.offline{
  border-color:rgba(255,117,139,.55);
  background:rgba(57,19,29,.97);
}

.connection-card:active{
  transform:scale(.985);
}

.status-dot{
  width:17px;
  height:17px;
  flex:none;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 16px var(--green);
}

.offline .status-dot{
  background:var(--red);
  box-shadow:0 0 16px var(--red);
}

.status-icon{
  font-size:27px;
  flex:none;
}

.connection-copy strong{
  display:block;
  font-size:12px;
  font-weight:950;
}

.connection-copy small{
  display:block;
  margin-top:3px;
  font-size:9px;
  color:rgba(255,255,255,.68);
  font-weight:750;
}


/* STORE TABS */

.store-tabs{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
  padding:12px 14px;
}

.store-tab{
  min-height:61px;

  border:
    1px solid
    rgba(98,199,255,.25);

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #0a1930,
      #071326
    );

  color:#e8f4ff;

  padding:8px 5px;

  font-size:10px;
  font-weight:950;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:5px;
}

.store-tab.active{
  border-color:var(--blue);

  background:
    linear-gradient(
      180deg,
      #0c3152,
      #09223b
    );

  box-shadow:
    0 0 18px
    rgba(98,199,255,.16);
}

.store-logo{
  font-size:18px;
  line-height:1;
}

.walmart-logo{color:#ffd84a}
.target-logo{color:#ff4055}
.sams-logo{color:#41a8ff}
.bestbuy-logo{color:#ffe23f}
.costco-logo{color:#ff6575}


/* MONITOR */

.monitor-wrap{
  padding:0 14px 14px;
}

.monitor-panel{
  border:1px solid rgba(98,199,255,.30);
  border-radius:17px;

  background:
    linear-gradient(
      180deg,
      rgba(8,31,56,.98),
      rgba(5,19,36,.98)
    );

  overflow:hidden;
}

.monitor-inner{
  padding:15px;
}

.monitor-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.monitor-name-wrap{
  display:flex;
  align-items:center;
  gap:9px;
}

.monitor-store-icon{
  width:34px;
  height:34px;

  border-radius:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(98,199,255,.08);

  font-size:23px;
}

.monitor-title{
  font-size:22px;
  font-weight:950;
}

.live-pill{
  display:flex;
  align-items:center;
  gap:6px;

  border:
    1px solid
    rgba(84,243,166,.4);

  border-radius:999px;

  padding:7px 11px;

  font-size:10px;
  font-weight:950;

  color:var(--green);

  background:
    rgba(8,44,37,.72);
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
}


/* STATS */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px;
}

.stat-card{
  min-height:78px;

  border:
    1px solid
    rgba(98,199,255,.22);

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #091a30,
      #071326
    );

  padding:11px;
}

.stat-card span{
  display:block;
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
}

.stat-card strong{
  display:block;
  margin-top:6px;
  font-size:12px;
  line-height:1.3;
}


/* ACTIONS */

.monitor-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px;
}

.monitor-action{
  min-height:48px;

  border-radius:11px;

  border:
    1px solid
    rgba(98,199,255,.36);

  background:#09203a;

  color:white;

  font-size:11px;
  font-weight:950;
}

.monitor-action.primary{
  border-color:
    rgba(84,243,166,.55);

  background:
    linear-gradient(
      180deg,
      #12a954,
      #08753f
    );
}

.monitor-action:disabled{
  opacity:.6;
}

.push-debug{
  margin-top:9px;

  padding:9px 10px;

  border-radius:9px;

  border:
    1px solid
    rgba(98,199,255,.13);

  color:var(--muted);

  background:
    rgba(2,12,23,.72);

  font-size:9px;
  line-height:1.5;
}


/* SECTION HEADERS */

.section-heading{
  margin-top:18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.section-heading strong{
  font-size:12px;
  font-weight:950;
}

.section-heading span{
  color:var(--blue);
  font-size:10px;
  font-weight:900;
}


/* DISCOVERY */

.discovery-grid{
  display:flex;
  overflow-x:auto;
  gap:8px;

  margin-top:9px;
  padding-bottom:6px;

  scroll-snap-type:x mandatory;
}

.discovery-card{
  flex:0 0 155px;
  min-width:155px;

  border:
    1px solid
    rgba(98,199,255,.18);

  border-radius:11px;

  background:
    linear-gradient(
      180deg,
      #091a30,
      #06111f
    );

  overflow:hidden;

  scroll-snap-align:start;
}

.discovery-image{
  height:120px;

  background:#07101c;

  display:flex;
  align-items:center;
  justify-content:center;
}

.discovery-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.discovery-body{
  padding:9px;
}

.discovery-status{
  display:inline-flex;

  border:
    1px solid
    rgba(84,243,166,.5);

  border-radius:999px;

  padding:3px 6px;

  color:var(--green);

  font-size:8px;
  font-weight:950;
}

.discovery-status.warn{
  border-color:rgba(255,199,107,.5);
  color:var(--gold);
}

.discovery-status.out{
  border-color:rgba(255,117,139,.5);
  color:var(--red);
}

.discovery-name{
  margin-top:6px;
  height:38px;
  overflow:hidden;
  font-size:10px;
  line-height:1.25;
  font-weight:900;
}

.discovery-price{
  margin-top:6px;
  font-size:15px;
  font-weight:950;
}

.discovery-open{
  display:block;

  margin-top:7px;

  padding:7px;

  text-align:center;

  border-radius:7px;

  border:
    1px solid
    rgba(98,199,255,.5);

  background:#0a3153;

  color:white;

  font-size:9px;
  font-weight:900;
}


/* ALL PRODUCTS */

.all-products-section{
  margin-top:16px;
  padding-top:14px;

  border-top:
    1px solid
    rgba(98,199,255,.14);
}

.search-row{
  display:flex;
  gap:8px;
  margin-top:9px;
}

.search-box{
  flex:1;
  min-width:0;

  border:
    1px solid
    rgba(98,199,255,.28);

  background:#061426;

  border-radius:10px;

  color:white;

  padding:11px 12px;
}

.filter-button{
  border:
    1px solid
    rgba(98,199,255,.3);

  border-radius:10px;

  color:white;

  background:#0a1930;

  padding:10px 15px;

  font-weight:850;
}

.meta-row{
  display:flex;
  justify-content:space-between;
  gap:10px;

  margin-top:8px;

  color:var(--muted);

  font-size:9px;
}


/* PRODUCT CARDS */

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:12px;
}

.product-card{
  border:
    1px solid
    rgba(98,199,255,.17);

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #09192d,
      #06111f
    );

  overflow:hidden;
}

.product-image{
  height:190px;

  background:#07101c;

  display:flex;
  justify-content:center;
  align-items:center;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.product-body{
  padding:11px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.badge{
  display:inline-flex;

  padding:4px 7px;

  border-radius:999px;

  border:
    1px solid
    rgba(255,255,255,.16);

  font-size:8px;
  font-weight:950;

  text-transform:uppercase;
}

.badge.good{
  color:var(--green);
  border-color:rgba(84,243,166,.45);
}

.badge.warn{
  color:var(--gold);
  border-color:rgba(255,199,107,.45);
}

.badge.out{
  color:var(--red);
  border-color:rgba(255,117,139,.45);
}

.product-name{
  margin-top:8px;

  font-size:14px;
  font-weight:950;
  line-height:1.25;
}

.product-seller{
  margin-top:4px;

  color:var(--muted);

  font-size:9px;
}

.product-price{
  margin-top:8px;

  font-size:19px;
  font-weight:950;
}

.open-product{
  display:block;

  margin-top:9px;

  padding:9px;

  text-align:center;

  border:
    1px solid
    rgba(98,199,255,.45);

  border-radius:8px;

  background:#0a3153;

  font-size:10px;
  font-weight:950;
}

.empty{
  grid-column:1/-1;

  width:100%;

  padding:30px 15px;

  border:
    1px dashed
    rgba(98,199,255,.24);

  border-radius:12px;

  text-align:center;

  color:var(--muted);

  font-size:11px;
}


/* BOTTOM NAV */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:30;

  margin:auto;

  width:100%;
  max-width:1100px;

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  background:
    rgba(3,13,27,.97);

  border-top:
    1px solid
    rgba(98,199,255,.22);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  padding-bottom:
    env(safe-area-inset-bottom);
}

.nav-btn{
  min-height:65px;

  border:0;

  background:transparent;

  color:#e8f4ff;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:4px;

  font-size:8px;
  font-weight:850;
}

.nav-btn.active{
  background:
    rgba(20,115,180,.13);

  color:var(--blue);
}

.nav-icon{
  font-size:21px;
  line-height:1;
}


/* MOBILE */

@media(max-width:760px){

  .products{
    grid-template-columns:1fr;
  }

}

@media(max-width:390px){

  .connection-row{
    grid-template-columns:1fr;
  }

  .stats-grid{
    grid-template-columns:1fr;
  }

  .monitor-actions{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>

<div class="app">

  <div class="hero"></div>


  <div class="connection-row">

    <div
      id="backendStatus"
      class="connection-card offline"
    >

      <span class="status-dot"></span>

      <div class="connection-copy">

        <strong>
          CONNECTING...
        </strong>

        <small>
          MONITOR STATUS
        </small>

      </div>

    </div>


    <button
      id="pushStatus"
      class="connection-card push"
      type="button"
    >

      <span class="status-icon">
        🔔
      </span>

      <div class="connection-copy">

        <strong id="pushStatusText">
          CHECKING ALERTS...
        </strong>

        <small id="pushStatusSub">
          CHECKING THIS IPHONE
        </small>

      </div>

    </button>

  </div>


  <div class="store-tabs">

    <button
      class="store-tab active"
      data-retailer="walmart"
    >
      <span class="store-logo walmart-logo">✦</span>
      WALMART
    </button>


    <button
      class="store-tab"
      data-retailer="target"
    >
      <span class="store-logo target-logo">⦿</span>
      TARGET
    </button>


    <button
      class="store-tab"
      data-retailer="sams"
    >
      <span class="store-logo sams-logo">◇</span>
      SAM'S CLUB
    </button>


    <button
      class="store-tab"
      data-retailer="bestbuy"
    >
      <span class="store-logo bestbuy-logo">▰</span>
      BEST BUY
    </button>


    <button
      class="store-tab"
      data-retailer="costco"
    >
      <span class="store-logo costco-logo">C</span>
      COSTCO
    </button>

  </div>


  <div class="monitor-wrap">

    <div class="monitor-panel">

      <div class="monitor-inner">

        <div class="monitor-head">

          <div class="monitor-name-wrap">

            <div
              id="monitorStoreIcon"
              class="monitor-store-icon"
            >
              ✦
            </div>

            <div
              id="monitorTitle"
              class="monitor-title"
            >
              Walmart Monitor
            </div>

          </div>


          <div
            id="monitorState"
            class="live-pill"
          >
            <span class="live-dot"></span>
            <span>LIVE</span>
          </div>

        </div>


        <div class="stats-grid">

          <div class="stat-card">
            <span>Scan schedule</span>
            <strong id="scanSchedule">
              Loading…
            </strong>
          </div>

          <div class="stat-card">
            <span>Last scan</span>
            <strong id="lastScan">
              —
            </strong>
          </div>

          <div class="stat-card">
            <span>Next scan</span>
            <strong id="nextScan">
              —
            </strong>
          </div>

        </div>


        <div class="monitor-actions">

          <button
            id="primaryAction"
            class="monitor-action primary"
          >
            SCAN WALMART NOW
          </button>

          <button
            id="secondaryAction"
            class="monitor-action"
          >
            RESET SCAN KEY
          </button>

        </div>


        <div
          id="pushDebug"
          class="push-debug"
        >
          Checking phone alert status…
        </div>


        <div class="section-heading">

          <strong>
            POKÉMON PRODUCT DISCOVERY
          </strong>

          <span>
            LIVE
          </span>

        </div>


        <div
          id="discoveryGrid"
          class="discovery-grid"
        ></div>


        <div class="all-products-section">

          <div class="section-heading">

            <strong id="allItemsTitle">
              ALL MONITORED ITEMS
            </strong>

            <span id="visibleCount">
              0 ITEMS
            </span>

          </div>


          <div class="search-row">

            <input
              id="search"
              class="search-box"
              placeholder="Search Pokémon products..."
            >

            <button
              id="refresh"
              class="filter-button"
            >
              REFRESH
            </button>

          </div>


          <div class="meta-row">

            <span id="retailerStatus">
              Connecting…
            </span>

            <span id="lastUpdated">
              Not updated yet
            </span>

          </div>


          <div
            id="products"
            class="products"
          ></div>

        </div>

      </div>

    </div>

  </div>

</div>


<nav class="bottom-nav">

  <button
    id="homeNav"
    class="nav-btn active"
  >
    <span class="nav-icon">⌂</span>
    HOME
  </button>


  <button
    class="nav-btn retailer-nav"
    data-retailer="walmart"
  >
    <span class="nav-icon walmart-logo">✦</span>
    Walmart
  </button>


  <button
    class="nav-btn retailer-nav"
    data-retailer="target"
  >
    <span class="nav-icon target-logo">⦿</span>
    Target
  </button>


  <button
    class="nav-btn retailer-nav"
    data-retailer="sams"
  >
    <span class="nav-icon sams-logo">◇</span>
    Sam's Club
  </button>


  <button
    class="nav-btn retailer-nav"
    data-retailer="bestbuy"
  >
    <span class="nav-icon bestbuy-logo">▰</span>
    Best Buy
  </button>


  <button
    class="nav-btn retailer-nav"
    data-retailer="costco"
  >
    <span class="nav-icon costco-logo">C</span>
    Costco
  </button>

</nav>


<script>

const RETAILERS = {

  walmart:{
    label:"Walmart",
    icon:"✦"
  },

  target:{
    label:"Target",
    icon:"⦿"
  },

  sams:{

    icon:"◇"
  },

  bestbuy:{
    label:"Best Buy",
    icon:"▰"
  },

  costco:{
    label:"Costco",
    icon:"C"
  }

};


const backendStatus =
  document.getElementById(
    "backendStatus"
  );

const pushStatus =
  document.getElementById(
    "pushStatus"
  );

const pushStatusText =
  document.getElementById(
    "pushStatusText"
  );

const pushStatusSub =
  document.getElementById(
    "pushStatusSub"
  );

const pushDebug =
  document.getElementById(
    "pushDebug"
  );

const monitorTitle =
  document.getElementById(
    "monitorTitle"
  );

const monitorStoreIcon =
  document.getElementById(
    "monitorStoreIcon"
  );

const monitorState =
  document.getElementById(
    "monitorState"
  );

const scanSchedule =
  document.getElementById(
    "scanSchedule"
  );

const lastScan =
  document.getElementById(
    "lastScan"
  );

const nextScan =
  document.getElementById(
    "nextScan"
  );

const primaryAction =
  document.getElementById(
    "primaryAction"
  );

const secondaryAction =
  document.getElementById(
    "secondaryAction"
  );

const discoveryGrid =
  document.getElementById(
    "discoveryGrid"
  );

const productsEl =
  document.getElementById(
    "products"
  );

const searchEl =
  document.getElementById(
    "search"
  );

const refreshBtn =
  document.getElementById(
    "refresh"
  );

const visibleCount =
  document.getElementById(
    "visibleCount"
  );

const retailerStatus =
  document.getElementById(
    "retailerStatus"
  );

const lastUpdated =
  document.getElementById(
    "lastUpdated"
  );

const allItemsTitle =
  document.getElementById(
    "allItemsTitle"
  );


let activeRetailer =
  "walmart";

let currentProducts =
  [];

let providers =
  [];

let statusData =
  {};


function escapeHtml(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#39;"
    })[character]
  );

}


function money(value){

  const number =
    Number(value);

  if(
    !Number.isFinite(
      number
    )
  ){
    return "Price unavailable";
  }

  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD"
    }
  ).format(number);

}


function formatDate(value){

  if(!value){
    return "—";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "—";
  }

  return date.toLocaleString();

}


function fallbackImage(name){

  const safe =
    escapeHtml(
      name ||
      "Pokémon Product"
    ).slice(
      0,
      40
    );

  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500">
      <rect width="100%" height="100%" fill="#061426"/>
      <circle cx="350" cy="210" r="110" fill="#0d3151"/>
      <text x="350" y="205" text-anchor="middle" fill="#fff" font-size="26" font-family="Arial" font-weight="700">${safe}</text>
      <text x="350" y="345" text-anchor="middle" fill="#62c7ff" font-size="18" font-family="Arial" font-weight="700">POKÉMON MONITOR</text>
    </svg>`;

  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg)
  );

}


function getProvider(retailer){

  return (
    providers.find(
      item =>
        item.retailer ===
        retailer
    ) ||
    {
      retailer,
      label:
        RETAILERS[
          retailer
        ]?.label ||
        retailer,
      configured:false,
      running:false,
      error:null,
      itemCount:0,
      lastRun:null
    }
  );

}


/* PUSH */

function isStandalone(){

  return (
    window.matchMedia(
      "(display-mode: standalone)"
    ).matches ||
    window.navigator
      .standalone === true
  );

}


function setPushState(
  state,
  title,
  subtitle
){

  pushStatus.classList.remove(
    "offline",
    "active"
  );

  if(
    state ===
    "offline"
  ){
    pushStatus.classList.add(
      "offline"
    );
  }

  if(
    state ===
    "online"
  ){
    pushStatus.classList.add(
      "active"
    );
  }

  pushStatusText.textContent =
    title;

  pushStatusSub.textContent =
    subtitle;

}


function setPushDebug(text){

  pushDebug.textContent =
    text;

}


function urlBase64ToUint8Array(
  base64String
){

  const padding =
    "=".repeat(
      (
        4 -
        base64String.length % 4
      ) % 4
    );

  const base64 =
    (
      base64String +
      padding
    )
      .replace(/-/g,"+")
      .replace(/_/g,"/");

  const rawData =
    window.atob(base64);

  return Uint8Array.from(
    [...rawData].map(
      character =>
        character.charCodeAt(0)
    )
  );

}


async function registerServiceWorker(){

  if(
    !(
      "serviceWorker"
      in navigator
    )
  ){
    throw new Error(
      "Service workers are unavailable."
    );
  }

  const registration =
    await navigator
      .serviceWorker
      .register(
        "/sw.js",
        {
          scope:"/"
        }
      );

  await navigator
    .serviceWorker
    .ready;

  return registration;

}


async function checkPush(){

  try{

    if(
      !window.isSecureContext
    ){

      setPushState(
        "offline",
        "HTTPS REQUIRED",
        "OPEN THE SECURE APP"
      );

      setPushDebug(
        "Push alerts require HTTPS."
      );

      return;
    }


    if(
      !(
        "Notification"
        in window
      )
    ){

      setPushState(
        "offline",
        "NOTIFICATIONS UNSUPPORTED",
        "OPEN FROM HOME SCREEN"
      );

      setPushDebug(
        "Open the installed Pokémon Monitor from your iPhone Home Screen."
      );

      return;
    }


    if(
      !(
        "PushManager"
        in window
      )
    ){

      setPushState(
        "offline",
        "PUSH NOT AVAILABLE",
        "OPEN FROM HOME SCREEN"
      );

      setPushDebug(
        isStandalone()
          ? "PushManager is unavailable."
          : "Open the app from its Home Screen icon."
      );

      return;
    }


    const registration =
      await registerServiceWorker();

    const subscription =
      await registration
        .pushManager
        .getSubscription();


    if(subscription){

      setPushState(
        "online",
        "PUSH ALERTS ACTIVE",
        "THIS IPHONE IS SUBSCRIBED"
      );

      setPushDebug(
        "SUCCESS: This iPhone is subscribed to Pokémon alerts."
      );

      return;
    }


    if(
      Notification.permission ===
      "denied"
    ){

      setPushState(
        "offline",
        "ALERTS BLOCKED",
        "ENABLE IN IPHONE SETTINGS"
      );

      setPushDebug(
        "Notification permission is blocked."
      );

      return;
    }


    setPushState(
      "ready",
      "ENABLE PHONE ALERTS",
      "TAP TO SUBSCRIBE THIS IPHONE"
    );

    setPushDebug(
      "Tap ENABLE PHONE ALERTS above."
    );


  }catch(error){

    console.error(error);

    setPushState(
      "offline",
      "PUSH CHECK FAILED",
      "TAP TO TRY AGAIN"
    );

    setPushDebug(
      error.message
    );

  }

}


async function enablePhoneAlerts(){

  try{

    const registration =
      await registerServiceWorker();

    const existing =
      await registration
        .pushManager
        .getSubscription();


    if(existing){

      setPushState(
        "online",
        "PUSH ALERTS ACTIVE",
        "THIS IPHONE IS SUBSCRIBED"
      );

      setPushDebug(
        "SUCCESS: This iPhone is already subscribed to Pokémon alerts."
      );

      return;
    }


    setPushState(
      "ready",
      "CONNECTING...",
      "SETTING UP THIS IPHONE"
    );


    if(
      !(
        "Notification"
        in window
      )
    ){

      throw new Error(
        "Notifications are unavailable here. Open the installed app from your Home Screen."
      );

    }


    const permission =
      await Notification
        .requestPermission();


    if(
      permission !==
      "granted"
    ){

      throw new Error(
        `Notification permission is ${permission}.`
      );

    }


    const keyResponse =
      await fetch(
        `/api/push/public-key?t=${Date.now()}`,
        {
          cache:"no-store"
        }
      );


    const keyData =
      await keyResponse
        .json();


    if(
      !keyResponse.ok
    ){

      throw new Error(
        keyData.error ||
        "Push key could not be loaded."
      );

    }


    const subscription =
      await registration
        .pushManager
        .subscribe(
          {
            userVisibleOnly:true,
            applicationServerKey:
              urlBase64ToUint8Array(
                keyData.publicKey
              )
          }
        );


    const response =
      await fetch(
        "/api/push/subscribe",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify(
              subscription.toJSON
                ? subscription.toJSON()
                : subscription
            )
        }
      );


    const result =
      await response
        .json();


    if(
      !response.ok
    ){

      throw new Error(
        result.error ||
        "Push subscription failed."
      );

    }


    setPushState(
      "online",
      "PUSH ALERTS ACTIVE",
      "THIS IPHONE IS SUBSCRIBED"
    );

    setPushDebug(
      "SUCCESS: This iPhone is subscribed to Pokémon alerts."
    );


  }catch(error){

    console.error(error);

    setPushState(
      "offline",
      "PUSH SETUP FAILED",
      "TAP TO TRY AGAIN"
    );

    setPushDebug(
      error.message
    );

  }

}


/* PRODUCT STATUS */

function statusClass(status){

  const normalized =
    String(
      status ||
      ""
    ).toLowerCase();

  if(
    [
      "instock",
      "in stock",
      "onhand",
      "available"
    ].includes(normalized)
  ){
    return "good";
  }

  if(
    [
      "preorder",
      "transit",
      "ordered",
      "lowstock",
      "low stock",
      "watching"
    ].includes(normalized)
  ){
    return "warn";
  }

  return "out";

}


function prettyStatus(status){

  const normalized =
    String(
      status ||
      ""
    ).toLowerCase();

  if(
    normalized ===
    "instock"
  ){
    return "IN STOCK";
  }

  if(
    normalized ===
    "onhand"
  ){
    return "ON HAND";
  }

  if(
    normalized ===
    "preorder"
  ){
    return "PREORDER";
  }

  if(
    normalized ===
    "transit"
  ){
    return "IN TRANSIT";
  }

  if(
    normalized ===
    "ordered"
  ){
    return "ORDERED";
  }

  if(
    normalized ===
    "watching"
  ){
    return "WATCHING";
  }

  return (
    status
      ? String(status).toUpperCase()
      : "UNKNOWN"
  );

}

            .toLowerCase()

          String(
            product.seller || ""
          )
            .toLowerCase()
            .includes(query)

          ||

          String(
            product.storeName || ""
          )
            .toLowerCase()
            .includes(query)
        );

      }
    );

    `${filtered.length} ITEM${

    }`;

          fallbackImage(
            product.name
          );

        const state =
          statusClass(
            product.status
          );

        return (
          `<article class="product-card">

            <div class="product-image">

              <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(product.name)}"
                onerror="this.onerror=null;this.src='${fallbackImage(product.name)}'"
              >

            </div>

            <div class="product-body">

              <div class="badges">

                <span class="badge ${state}">
                  ${escapeHtml(
                    prettyStatus(
                      product.status
                    )
                  )}
                </span>

                <span class="badge">
                  ${
                    product.channel ===
                    "store"
                      ? "IN STORE"
                      : "ONLINE"
                  }
                </span>

              </div>

              <div class="product-name">
                ${escapeHtml(
                  product.name
                )}
              </div>

              <div class="product-seller">
                ${
                  product.seller
                    ? `Seller: ${escapeHtml(product.seller)}`
                    : ""
                }
              </div>

              <div class="product-price">
                ${money(
                  product.price
                )}
              </div>

              ${
                product.url
                  ? `<a
                      class="open-product"
                      href="${escapeHtml(product.url)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      OPEN PRODUCT
                    </a>`

              }

            </div>

          </article>`

}


/* RETAILER PANEL */

function renderRetailer(){

  const retailer =
    RETAILERS[
      activeRetailer
    ];

  const provider =
    getProvider(
      activeRetailer
    );


  monitorTitle.textContent =
    `${retailer.label} Monitor`;

  monitorStoreIcon.textContent =
    retailer.icon;

  allItemsTitle.textContent =
    `ALL MONITORED ITEMS (${retailer.label.toUpperCase()})`;

  searchEl.placeholder =
    `Search ${retailer.label} Pokémon products...`;


  if(
    activeRetailer ===
    "walmart"
  ){

    const schedule =
      statusData
        ?.walmartSchedule ||
      {};

    scanSchedule.textContent =
      schedule.scheduleLabel ||
      "Scheduled monitoring";

    lastScan.textContent =
      formatDate(
        schedule.lastScheduledRun ||
        statusData.lastRun
      );

    nextScan.textContent =
      schedule.nextScanLabel
        ? formatDate(
            schedule.nextScanLabel
          )
        : "Automatic";

    monitorState.innerHTML =
      `<span class="live-dot"></span>
       <span>${
         schedule.activeWindow
           ? "LIVE"
           : "SCHEDULED"
       }</span>`;

    primaryAction.textContent =
      "SCAN WALMART NOW";

    primaryAction.disabled =
      false;

    secondaryAction.textContent =
      "RESET SCAN KEY";

    secondaryAction.disabled =
      false;

    retailerStatus.textContent =
      `${currentProducts.length} Walmart products loaded`;

  }else{

    scanSchedule.textContent =
      provider.configured
        ? "Live monitoring"
        : "Not connected";

    lastScan.textContent =
      provider.lastRun
        ? formatDate(
            provider.lastRun
          )
        : "—";

    nextScan.textContent =
      provider.configured
        ? "Automatic"
        : "—";

    monitorState.innerHTML =
      `<span class="live-dot"></span>
       <span>${
         provider.error
           ? "ERROR"
           : provider.running
             ? "SCANNING"
             : provider.configured
               ? "LIVE"
               : "OFFLINE"
       }</span>`;

    primaryAction.textContent =
      `REFRESH ${retailer.label.toUpperCase()}`;

    primaryAction.disabled =
      false;

    secondaryAction.textContent =
      provider.configured
        ? "MONITOR CONNECTED"
        : "NOT CONFIGURED";

    secondaryAction.disabled =
      true;

    retailerStatus.textContent =
      provider.error
        ? provider.error
        : provider.configured
          ? `${retailer.label} monitor connected`
          : `${retailer.label} provider not configured`;

  }


  renderDiscovery();

  renderProducts();

}


/* FETCH PRODUCTS */

async function fetchProducts(){

  const response =
    await fetch(
      `/api/products?retailer=${encodeURIComponent(activeRetailer)}&t=${Date.now()}`,
      {
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      `${RETAILERS[activeRetailer].label} inventory request failed`
    );

  }


  const data =
    await response.json();


  currentProducts =
    Array.isArray(
      data.items
    )
      ? data.items
      : [];

}


/* LOAD */

async function load(){

  refreshBtn.disabled =
    true;


  try{

    const [
      providersResponse,
      statusResponse
    ] = await Promise.all([

      fetch(
        `/api/providers?t=${Date.now()}`,
        {
          cache:"no-store"
        }
      ),

      fetch(
        `/api/status?t=${Date.now()}`,
        {
          cache:"no-store"
        }
      )

    ]);


    if(
      !providersResponse.ok ||
      !statusResponse.ok
    ){

      throw new Error(
        "Backend request failed"
      );

    }


    const [
      providersData,
      currentStatus
    ] = await Promise.all([

      providersResponse.json(),

      statusResponse.json()

    ]);


    providers =
      Array.isArray(
        providersData.providers
      )
        ? providersData.providers
        : [];


    statusData =
      currentStatus ||
      {};


    await fetchProducts();


    renderRetailer();


    backendStatus
      .classList
      .remove(
        "offline"
      );


    backendStatus
      .querySelector(
        "strong"
      )
      .textContent =
      "BACKEND ONLINE";


    backendStatus
      .querySelector(
        "small"
      )
      .textContent =
      "MONITOR ACTIVE";


    lastUpdated.textContent =
      `Updated ${new Date().toLocaleTimeString()}`;


  }catch(error){

    console.error(error);


    backendStatus
      .classList
      .add(
        "offline"
      );


    backendStatus
      .querySelector(
        "strong"
      )
      .textContent =
      "BACKEND OFFLINE";


    backendStatus
      .querySelector(
        "small"
      )
      .textContent =
      "CONNECTION ERROR";


    retailerStatus.textContent =
      error.message;


  }finally{

    refreshBtn.disabled =
      false;

  }

}


/* SWITCH RETAILER */

async function switchRetailer(
  retailer
){

  activeRetailer =
    retailer;

  searchEl.value =
    "";


  document
    .querySelectorAll(
      ".store-tab"
    )
    .forEach(
      button => {

        button
          .classList
          .toggle(
            "active",
            button.dataset.retailer ===
            retailer
          );

      }
    );


  document
    .querySelectorAll(
      ".retailer-nav"
    )
    .forEach(
      button => {

        button
          .classList
          .toggle(
            "active",
            button.dataset.retailer ===
            retailer
          );

      }
    );


  document
    .getElementById(
      "homeNav"
    )
    .classList
    .remove(
      "active"
    );


  currentProducts =
    [];


  renderRetailer();


  await load();

}


/* WALMART SCAN */

async function runWalmartScan(){

  let token =
    localStorage.getItem(
      "pokemonMonitorScanToken"
    ) || "";


  if(!token){

    token =
      prompt(
        "Enter your MANUAL_SCAN_TOKEN from Render:"
      ) || "";


    if(!token){
      return;
    }


    localStorage.setItem(
      "pokemonMonitorScanToken",
      token
    );

  }


  primaryAction.disabled =
    true;

  primaryAction.textContent =
    "SCANNING…";


  try{

    const response =
      await fetch(
        "/api/walmart/scan",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-monitor-token":
              token
          },

          body:"{}"
        }
      );


    const data =
      await response.json();


    if(
      response.status ===
      401
    ){

      localStorage.removeItem(
        "pokemonMonitorScanToken"
      );

      throw new Error(
        "Scan key rejected. Tap scan again and enter the correct key."
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        data.result?.reason ||
        "Walmart scan failed."
      );

    }


    await load();


  }catch(error){

    alert(
      error.message
    );


  }finally{

    primaryAction.disabled =
      false;

    primaryAction.textContent =
      "SCAN WALMART NOW";

  }

}


/* EVENTS */

primaryAction.addEventListener(
  "click",
  async () => {

    if(
      activeRetailer ===
      "walmart"
    ){

      await runWalmartScan();

    }else{

      await load();

    }

  }
);


secondaryAction.addEventListener(
  "click",
  () => {

    if(
      activeRetailer !==
      "walmart"
    ){
      return;
    }

    localStorage.removeItem(
      "pokemonMonitorScanToken"
    );

    alert(
      "Saved scan key cleared."
    );

  }
);


refreshBtn.addEventListener(
  "click",
  load
);


searchEl.addEventListener(
  "input",
  renderProducts
);


pushStatus.addEventListener(
  "click",
  enablePhoneAlerts
);


document
  .querySelectorAll(
    ".store-tab"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          switchRetailer(
            button.dataset.retailer
          );

        }
      );

    }
  );


document
  .querySelectorAll(
    ".retailer-nav"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          switchRetailer(
            button.dataset.retailer
          );

        }
      );

    }
  );


document
  .getElementById(
    "homeNav"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "homeNav"
        )
        .classList
        .add(
          "active"
        );

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }
  );


load();

checkPush();


setInterval(
  load,
  15000
);
