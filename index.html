<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#020711"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<title>Pokémon Restock Monitor</title>

<style>

:root{
  --bg:#020711;
  --panel:#071326;
  --panel2:#0a1b31;
  --text:#f7fbff;
  --muted:#96a8bf;
  --green:#54f3a6;
  --blue:#62c7ff;
  --gold:#ffc76b;
  --red:#ff758b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:
    max(
      24px,
      env(safe-area-inset-bottom)
    );
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.app{
  max-width:980px;
  margin:auto;
  overflow:hidden;
}

.hero{
  height:360px;

  background:
    linear-gradient(
      to bottom,
      rgba(2,7,17,0) 58%,
      rgba(2,7,17,.35) 76%,
      var(--bg) 100%
    ),
    url("hero.jpg")
    center top /
    cover
    no-repeat;
}

.status-wrap{
  display:grid;
  grid-template-columns:
    1fr
    1fr;

  gap:9px;

  padding:
    0
    14px;

  margin-top:-28px;

  position:relative;
  z-index:2;
}

.status-pill{
  min-height:46px;

  border:
    1px solid
    rgba(84,243,166,.55);

  border-radius:12px;

  background:
    rgba(8,44,37,.96);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  font-size:12px;
  font-weight:900;
}

.status-pill.offline{
  border-color:
    rgba(255,117,139,.55);

  background:
    rgba(57,19,29,.96);
}

.dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:
    var(--green);

  box-shadow:
    0 0 8px
    var(--green);
}

.offline .dot{
  background:
    var(--red);

  box-shadow:
    0 0 8px
    var(--red);
}

.section{
  padding:
    12px
    14px;
}

.tabs{
  display:grid;

  grid-template-columns:
    repeat(
      5,
      minmax(0,1fr)
    );

  gap:7px;
}

.tab{
  border:
    1px solid
    rgba(98,199,255,.25);

  border-radius:10px;

  background:
    var(--panel);

  color:#dcecff;

  padding:
    11px
    6px;

  font-size:11px;
  font-weight:900;
}

.tab.active{
  border-color:
    var(--green);

  background:
    #0d2f2a;

  color:white;
}

.monitor-panel{
  border:
    1px solid
    rgba(98,199,255,.24);

  border-radius:14px;

  background:
    linear-gradient(
      180deg,
      #0b1d34,
      #071326
    );

  padding:14px;
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:
    space-between;

  gap:10px;
}

.panel-title{
  font-size:15px;
  font-weight:900;
}

.panel-status{
  font-size:10px;
  font-weight:900;

  padding:
    5px
    8px;

  border-radius:
    999px;

  border:
    1px solid
    rgba(84,243,166,.35);

  color:
    var(--green);
}

.panel-status.warn{
  border-color:
    rgba(255,199,107,.45);

  color:
    var(--gold);
}

.panel-status.off{
  border-color:
    rgba(255,117,139,.4);

  color:
    var(--red);
}

.schedule-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;

  margin-top:10px;
}

.schedule-box{
  background:
    #06111f;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:10px;

  padding:10px;
}

.schedule-box span{
  display:block;

  color:
    var(--muted);

  font-size:9px;

  text-transform:
    uppercase;

  font-weight:800;
}

.schedule-box strong{
  display:block;

  margin-top:4px;

  font-size:12px;
}

.panel-actions{
  display:flex;

  gap:8px;

  margin-top:10px;
}

.action-btn{
  flex:1;

  border:
    1px solid
    rgba(84,243,166,.45);

  background:
    #0b2b25;

  color:white;

  border-radius:10px;

  padding:11px;

  font-weight:900;
}

.action-btn.secondary{
  border-color:
    rgba(98,199,255,.35);

  background:
    #0a1b31;
}

.healthline{
  margin-top:9px;

  color:
    var(--muted);

  font-size:10px;

  line-height:1.5;
}

.section-title{
  margin-top:16px;

  font-size:11px;

  font-weight:900;

  color:#dcecff;

  letter-spacing:.3px;
}

.discovery-list{
  display:grid;

  gap:7px;

  margin-top:7px;
}

.discovery-item{
  border:
    1px solid
    rgba(255,199,107,.28);

  border-radius:9px;

  padding:10px;

  background:#17140c;
}

.discovery-item.marketplace{
  border-color:
    rgba(98,199,255,.25);

  background:#081522;
}

.discovery-item.approved{
  border-color:
    rgba(84,243,166,.42);

  background:#0a201b;
}

.discovery-item strong{
  font-size:11px;
}

.discovery-item small{
  display:block;

  margin-top:4px;

  color:
    var(--muted);

  line-height:1.45;
}

.accordion{
  margin-top:10px;

  border:
    1px solid
    rgba(98,199,255,.2);

  border-radius:11px;

  overflow:hidden;

  background:#071524;
}

.accordion-button{
  width:100%;

  border:0;

  background:
    #091a2d;

  color:white;

  padding:
    13px
    12px;

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  font-size:11px;

  font-weight:900;

  text-align:left;
}

.accordion-button span:last-child{
  color:
    var(--blue);

  font-size:15px;
}

.accordion-content{
  display:none;

  padding:
    9px;
}

.accordion.open
.accordion-content{
  display:grid;

  gap:7px;
}

.accordion.open
.accordion-button
span:last-child{
  transform:
    rotate(180deg);
}

.accordion-item{
  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:9px;

  padding:9px;

  background:#06111f;
}

.accordion-item strong{
  display:block;

  font-size:11px;

  line-height:1.4;
}

.accordion-item small{
  display:block;

  margin-top:3px;

  color:
    var(--muted);

  font-size:10px;

  line-height:1.4;
}

.retailer-message{
  margin-top:12px;

  border:
    1px dashed
    rgba(98,199,255,.25);

  border-radius:12px;

  padding:20px;

  color:
    var(--muted);

  text-align:center;

  line-height:1.5;

  font-size:12px;
}

.toolbar{
  display:flex;

  gap:8px;

  align-items:center;
}

.toolbar input{
  flex:1;
  min-width:0;

  background:
    var(--panel);

  border:
    1px solid
    rgba(98,199,255,.25);

  color:white;

  border-radius:10px;

  padding:12px;
}

.toolbar button{
  border:
    1px solid
    rgba(84,243,166,.45);

  background:
    #0b2b25;

  color:#e9fff5;

  border-radius:10px;

  padding:
    12px
    16px;

  font-weight:900;
}

.meta{
  display:flex;

  justify-content:
    space-between;

  gap:10px;

  margin-top:8px;

  color:
    var(--muted);

  font-size:11px;
}

.products{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:12px;

  padding:
    4px
    14px
    20px;
}

.card{
  border:
    1px solid
    rgba(98,199,255,.18);

  border-radius:14px;

  background:
    linear-gradient(
      180deg,
      #09192d,
      #06111f
    );

  overflow:hidden;
}

.image-wrap{
  aspect-ratio:
    1.35 / 1;

  background:
    #08111e;

  display:flex;

  align-items:center;
  justify-content:center;

  position:relative;
}

.image-wrap img{
  width:100%;
  height:100%;

  object-fit:contain;
}

.image-note{
  position:absolute;

  bottom:7px;
  left:7px;

  background:
    rgba(2,7,17,.8);

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius:6px;

  padding:
    4px
    6px;

  font-size:9px;
  font-weight:900;
}

.body{
  padding:12px;
}

.badges{
  display:flex;

  flex-wrap:wrap;

  gap:6px;
}

.badge{
  display:inline-flex;

  border-radius:999px;

  border:
    1px solid
    rgba(255,255,255,.18);

  padding:
    4px
    7px;

  font-size:9px;

  font-weight:900;

  text-transform:
    uppercase;
}

.badge.good{
  border-color:
    rgba(84,243,166,.5);

  color:
    var(--green);
}

.badge.warn{
  border-color:
    rgba(255,199,107,.5);

  color:
    var(--gold);
}

.badge.out{
  border-color:
    rgba(255,117,139,.5);

  color:
    var(--red);
}

.name{
  margin-top:9px;

  font-size:15px;

  font-weight:900;

  line-height:1.3;
}

.sub{
  margin-top:4px;

  color:
    var(--muted);

  font-size:11px;
}

.price{
  margin-top:10px;

  font-size:21px;

  font-weight:900;
}

.price small{
  font-size:11px;

  color:
    var(--muted);

  font-weight:700;
}

.storeline{
  margin-top:8px;

  color:#dcecff;

  font-size:11px;
}

.buy{
  display:block;

  margin-top:11px;

  text-align:center;

  border:
    1px solid
    rgba(84,243,166,.5);

  border-radius:9px;

  background:
    #0c3128;

  padding:10px;

  font-size:11px;

  font-weight:900;
}

.empty{
  grid-column:
    1 / -1;

  border:
    1px dashed
    rgba(98,199,255,.25);

  border-radius:12px;

  padding:28px;

  text-align:center;

  color:
    var(--muted);
}

.hidden{
  display:none!important;
}

@media(max-width:760px){

  .tabs{
    grid-template-columns:
      repeat(2,1fr);
  }

  .tabs
  .tab:last-child{
    grid-column:
      1 / -1;
  }

  .schedule-grid{
    grid-template-columns:
      1fr;
  }

  .products{
    grid-template-columns:
      1fr;
  }

  .hero{
    height:320px;
  }

}

</style>
</head>

<body>

<div class="app">

  <div class="hero"></div>

  <div class="status-wrap">

    <div
      id="backendStatus"
      class="status-pill"
    >
      <span class="dot"></span>

      <span>
        LIVE MONITOR CONNECTED
      </span>
    </div>

    <div
      id="pushStatus"
      class="status-pill"
    >
      <span class="dot"></span>

      <span>
        PUSH ALERTS ACTIVE
      </span>
    </div>

  </div>

  <section class="section">

    <div class="tabs">

      <button
        class="tab active"
        data-retailer="walmart"
      >
        WALMART
      </button>

      <button
        class="tab"
        data-retailer="target"
      >
        TARGET
      </button>

      <button
        class="tab"
        data-retailer="sams"
      >
        SAM'S CLUB
      </button>

      <button
        class="tab"
        data-retailer="bestbuy"
      >
        BEST BUY
      </button>

      <button
        class="tab"
        data-retailer="costco"
      >
        COSTCO
      </button>

    </div>

  </section>

  <section class="section">

    <div class="monitor-panel">

      <div class="panel-head">

        <div
          id="monitorTitle"
          class="panel-title"
        >
          Walmart Monitor
        </div>

        <div
          id="monitorState"
          class="panel-status"
        >
          SCHEDULED
        </div>

      </div>

      <div id="retailerMonitorBody"></div>

    </div>

  </section>

  <section class="section">

    <div class="toolbar">

      <input
        id="search"
        placeholder="Search Walmart Pokémon products"
      >

      <button id="refresh">
        Refresh
      </button>

    </div>

    <div class="meta">

      <span id="visibleCount">
        0 products
      </span>

      <span id="lastUpdated">
        Not updated yet
      </span>

    </div>

  </section>

  <main
    id="products"
    class="products"
  ></main>

</div>

<script>

const RETAILER_LABELS = {
  walmart: "Walmart",
  target: "Target",
  sams: "Sam's Club",
  bestbuy: "Best Buy",
  costco: "Costco"
};

const RETAILER_TITLES = {
  walmart: "Walmart Monitor",
  target: "Target Monitor",
  sams: "Sam's Club Monitor",
  bestbuy: "Best Buy Monitor",
  costco: "Costco Monitor"
};

const RETAILER_CHANNELS = {
  walmart: "ONLINE",
  target: "ONLINE",
  sams: "ONLINE + CLUBS",
  bestbuy: "ONLINE + STORES",
  costco: "ONLINE + WAREHOUSES"
};

const productsEl =
  document.getElementById("products");

const searchEl =
  document.getElementById("search");

const refreshBtn =
  document.getElementById("refresh");

const backendStatus =
  document.getElementById("backendStatus");

const pushStatus =
  document.getElementById("pushStatus");

const visibleCount =
  document.getElementById("visibleCount");

const lastUpdated =
  document.getElementById("lastUpdated");

const monitorTitle =
  document.getElementById("monitorTitle");

const monitorState =
  document.getElementById("monitorState");

const retailerMonitorBody =
  document.getElementById("retailerMonitorBody");

let activeRetailer =
  "walmart";

let currentProducts =
  [];

let providerStates =
  [];

let latestStatus =
  {};

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#39;"
    })[character]
  );

}

function money(value){

  const number =
    Number(value);

  return Number.isFinite(number)
    ? new Intl.NumberFormat(
        "en-US",
        {
          style:"currency",
          currency:"USD"
        }
      ).format(number)
    : "Price unavailable";

}

function fallback(name){

  const label =
    esc(
      name ||
      "Pokémon product"
    ).slice(
      0,
      42
    );

  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520">` +
    `<rect width="100%" height="100%" fill="#071729"/>` +
    `<circle cx="350" cy="210" r="110" fill="#0d3151"/>` +
    `<text x="350" y="205" text-anchor="middle" fill="white" font-size="28" font-family="Arial" font-weight="700">${label}</text>` +
    `<text x="350" y="340" text-anchor="middle" fill="#54f3a6" font-size="22" font-family="Arial" font-weight="700">REPRESENTATIVE IMAGE</text>` +
    `<text x="350" y="375" text-anchor="middle" fill="#9aa9c1" font-size="16" font-family="Arial">Retailer image unavailable</text>` +
    `</svg>`;

  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg)
  );

}

function statusBadge(status){

  const normalized =
    String(
      status ||
      "out"
    ).toLowerCase();

  const cssClass =
    [
      "instock",
      "onhand"
    ].includes(normalized)
      ? "good"
      : [
          "transit",
          "ordered",
          "preorder",
          "watching"
        ].includes(normalized)
        ? "warn"
        : "out";

  return (
    `<span class="badge ${cssClass}">` +
    `${esc(normalized)}` +
    `</span>`
  );

}

function providerFor(retailer){

  return (
    providerStates.find(
      provider =>
        provider.retailer === retailer
    ) ||
    {
      retailer,
      label:
        RETAILER_LABELS[retailer] ||
        retailer,
      configured:false,
      running:false,
      error:null,
      itemCount:0,
      lastRun:null,
      lastSuccess:null
    }
  );

}

function accordion(
  id,
  title,
  count,
  content
){

  return (
    `<div class="accordion" id="${esc(id)}">` +

      `<button class="accordion-button" data-accordion="${esc(id)}">` +

        `<span>` +
          `${esc(title)} (${Number(count || 0)})` +
        `</span>` +

        `<span>⌄</span>` +

      `</button>` +

      `<div class="accordion-content">` +
        `${content}` +
      `</div>` +

    `</div>`
  );

}

function emptyAccordionMessage(text){

  return (
    `<div class="accordion-item">` +
      `<small>${esc(text)}</small>` +
    `</div>`
  );

}

function renderWalmartDiscovery(){

  const discovery =
    latestStatus
      ?.walmartPokemonDiscovery ||
    latestStatus
      ?.walmart30thDiscovery ||
    {};

  const items =
    Array.isArray(
      discovery.items
    )
      ? discovery.items
      : [];

  if (
    discovery.lastError
  ){
    return (
      `<div class="retailer-message">` +
      `Pokémon product discovery error: ` +
      `${esc(discovery.lastError)}` +
      `</div>`
    );
  }

  if (
    !discovery.lastRun
  ){
    return (
      `<div class="retailer-message">` +
      `No sealed Pokémon discovery scan has run yet.` +
      `</div>`
    );
  }

  if (
    !items.length
  ){
    return (
      `<div class="retailer-message">` +
      `No matching Walmart-direct or GT Collectibles sealed Pokémon products were found in the latest scan.` +
      `</div>`
    );
  }

  return (
    `<div class="discovery-list">` +

    items
      .slice(
        0,
        24
      )
      .map(
        item => {

          const state =
            item.directSeller
              ? (
                  item.inStock
                    ? "WALMART DIRECT • AVAILABLE"
                    : "WALMART DIRECT • WATCHING"
                )
              : item.approvedMarketplace
                ? (
                    item.inStock
                      ? "GT COLLECTIBLES • AVAILABLE"
                      : "GT COLLECTIBLES • WATCHING"
                  )
                : "MARKETPLACE • NOT APPROVED";

          const itemClass =
            item.directSeller
              ? ""
              : item.approvedMarketplace
                ? "approved"
                : "marketplace";

          return (
            `<a ` +
              `class="discovery-item ${itemClass}" ` +
              `href="${esc(item.url || "#")}" ` +
              `${item.url ? 'target="_blank" rel="noopener noreferrer"' : ""}` +
            `>` +

              `<strong>` +
                `${esc(item.name)}` +
              `</strong>` +

              `<small>` +
                `${esc(state)}` +
                `${item.price != null ? ` • ${money(item.price)}` : ""}` +
                `${item.rawStatus ? ` • ${esc(item.rawStatus)}` : ""}` +
              `</small>` +

            `</a>`
          );

        }
      )
      .join("") +

    `</div>`
  );

}

function renderWalmartUpcoming(){

  const detected =
    Array.isArray(
      latestStatus
        ?.walmartWatchlist
        ?.detected
    )
      ? latestStatus
          .walmartWatchlist
          .detected
      : [];

  if (
    !detected.length
  ){
    return emptyAccordionMessage(
      "No upcoming Walmart products detected right now."
    );
  }

  return detected
    .map(
      item =>
        `<a ` +
          `class="accordion-item" ` +
          `href="${esc(item.url || "#")}" ` +
          `${item.url ? 'target="_blank" rel="noopener noreferrer"' : ""}` +
        `>` +

          `<strong>` +
            `${esc(item.name)}` +
          `</strong>` +

          `<small>` +
            `${esc((item.dropType || item.status || "upcoming").toUpperCase())}` +
            `${item.price != null ? ` • ${money(item.price)}` : ""}` +
            `${item.rawStatus ? ` • ${esc(item.rawStatus)}` : ""}` +
          `</small>` +

        `</a>`
    )
    .join("");

}

function renderWalmartWatchlist(){

  const watching =
    Array.isArray(
      latestStatus
        ?.walmartWatchlist
        ?.watching
    )
      ? latestStatus
          .walmartWatchlist
          .watching
      : [];

  if (
    !watching.length
  ){
    return emptyAccordionMessage(
      "No Walmart watchlist items configured."
    );
  }

  return watching
    .map(
      item => {

        const sellerLabel =
          item.directSeller
            ? "WALMART DIRECT"
            : item.approvedMarketplace
              ? "GT COLLECTIBLES"
              : "WATCHING";

        return (
          `<a ` +
            `class="accordion-item" ` +
            `href="${esc(item.url || "#")}" ` +
            `${item.url ? 'target="_blank" rel="noopener noreferrer"' : ""}` +
          `>` +

            `<strong>` +
              `${esc(item.name)}` +
            `</strong>` +

            `<small>` +
              `${esc(sellerLabel)}` +
              `${item.price != null ? ` • ${money(item.price)}` : ""}` +
              `${item.msrp != null ? ` • MSRP ${money(item.msrp)}` : ""}` +
            `</small>` +

          `</a>`
        );

      }
    )
    .join("");

}

function renderWalmartMonitor(){

  const schedule =
    latestStatus
      ?.walmartSchedule ||
    {};

  const provider =
    latestStatus
      ?.walmartProvider ||
    {};

  const hasData =
    provider
      ?.health
      ?.hasdata ||
    {};

  const rapidApi =
    provider
      ?.health
      ?.rapidapi ||
    {};

  const upcoming =
    Array.isArray(
      latestStatus
        ?.walmartWatchlist
        ?.detected
    )
      ? latestStatus
          .walmartWatchlist
          .detected
      : [];

  const watching =
    Array.isArray(
      latestStatus
        ?.walmartWatchlist
        ?.watching
    )
      ? latestStatus
          .walmartWatchlist
          .watching
      : [];

  monitorState.className =
    "panel-status";

  monitorState.textContent =
    schedule.activeWindow
      ? "DROP WINDOW ACTIVE"
      : "SCHEDULED";

  retailerMonitorBody.innerHTML =

    `<div class="schedule-grid">` +

      `<div class="schedule-box">` +
        `<span>Drop window</span>` +
        `<strong>${esc(schedule.scheduleLabel || "Wednesday drop window")}</strong>` +
      `</div>` +

      `<div class="schedule-box">` +
        `<span>Primary source</span>` +
        `<strong>` +
          `${
            provider.primary
              ? `${esc(String(provider.primary).toUpperCase())}${provider.fallbackEnabled ? " → RAPIDAPI FALLBACK" : ""}`
              : "WALMART"
          }` +
        `</strong>` +
      `</div>` +

      `<div class="schedule-box">` +
        `<span>Last scan</span>` +
        `<strong>` +
          `${
            schedule.lastManualRun
              ? esc(new Date(schedule.lastManualRun).toLocaleString())
              : schedule.lastScheduledRun
                ? esc(new Date(schedule.lastScheduledRun).toLocaleString())
                : "—"
          }` +
        `</strong>` +
      `</div>` +

      `<div class="schedule-box">` +
        `<span>Next scan</span>` +
        `<strong>${esc(schedule.nextScanLabel || "—")}</strong>` +
      `</div>` +

    `</div>` +

    `<div class="panel-actions">` +

      `<button ` +
        `id="manualWalmartScan" ` +
        `class="action-btn"` +
      `>` +
        `SCAN WALMART NOW` +
      `</button>` +

      `<button ` +
        `id="forgetScanToken" ` +
        `class="action-btn secondary"` +
      `>` +
        `RESET SCAN KEY` +
      `</button>` +

    `</div>` +

    `<div class="healthline">` +
      `HasData: ${Number(hasData.successes || 0)} ok / ${Number(hasData.failures || 0)} failed` +
      ` • RapidAPI: ${Number(rapidApi.successes || 0)} ok / ${Number(rapidApi.failures || 0)} failed` +
      `${hasData.lastError ? ` • Last HasData error: ${esc(hasData.lastError)}` : ""}` +
    `</div>` +

    `<div class="section-title">` +
      `POKÉMON PRODUCT DISCOVERY` +
    `</div>` +

    renderWalmartDiscovery() +

    accordion(
      "walmart-upcoming",
      "UPCOMING",
      upcoming.length,
      renderWalmartUpcoming()
    ) +

    accordion(
      "walmart-watchlist",
      "WATCHLIST",
      watching.length,
      renderWalmartWatchlist()
    );

  const scanButton =
    document.getElementById(
      "manualWalmartScan"
    );

  const resetButton =
    document.getElementById(
      "forgetScanToken"
    );

  if (
    scanButton
  ){
    scanButton.addEventListener(
      "click",
      runManualWalmartScan
    );
  }

  if (
    resetButton
  ){
    resetButton.addEventListener(
      "click",
      () => {

        localStorage.removeItem(
          "pokemonMonitorScanToken"
        );

        alert(
          "Saved scan key cleared."
        );

      }
    );
  }

}

function renderOtherRetailerMonitor(){

  const provider =
    providerFor(
      activeRetailer
    );

  const label =
    RETAILER_LABELS[
      activeRetailer
    ];

  monitorState.className =
    provider.error
      ? "panel-status off"
      : provider.configured
        ? (
            provider.running
              ? "panel-status warn"
              : "panel-status"
          )
        : "panel-status off";

  monitorState.textContent =
    provider.error
      ? "ERROR"
      : provider.configured
        ? (
            provider.running
              ? "SCANNING"
              : "CONNECTED"
          )
        : "NOT CONFIGURED";

  const statusMessage =
    provider.configured
      ? (
          `${esc(label)} monitor is connected.` +
          `<br>` +
          `Live products: ${Number(provider.itemCount || 0)}` +
          `<br>` +
          `Last scan: ${provider.lastRun ? esc(new Date(provider.lastRun).toLocaleString()) : "—"}` +
          `${provider.error ? `<br>Error: ${esc(provider.error)}` : ""}`
        )
      : (
          `${esc(label)} is not connected yet.` +
          `<br>` +
          `No inventory is being fabricated for this retailer.`
        );

  retailerMonitorBody.innerHTML =

    `<div class="schedule-grid">` +

      `<div class="schedule-box">` +
        `<span>Retailer</span>` +
        `<strong>${esc(label)}</strong>` +
      `</div>` +

      `<div class="schedule-box">` +
        `<span>Channel</span>` +
        `<strong>${esc(RETAILER_CHANNELS[activeRetailer] || "ONLINE")}</strong>` +
      `</div>` +

      `<div class="schedule-box">` +
        `<span>Last scan</span>` +
        `<strong>${provider.lastRun ? esc(new Date(provider.lastRun).toLocaleString()) : "—"}</strong>` +
      `</div>` +

      `<div class="schedule-box">` +
        `<span>Live products</span>` +
        `<strong>${Number(provider.itemCount || 0)}</strong>` +
      `</div>` +

    `</div>` +

    `<div class="retailer-message">` +
      statusMessage +
    `</div>` +

    `<div class="section-title">` +
      `AVAILABLE / DISCOVERED` +
    `</div>` +

    `<div class="retailer-message">` +
      `${
        provider.configured
          ? `Current ${esc(label)} results appear below in this tab only.`
          : `${esc(label)} discovery will appear here when its data source is connected.`
      }` +
    `</div>` +

    accordion(
      `${activeRetailer}-upcoming`,
      "UPCOMING",
      0,
      emptyAccordionMessage(
        provider.configured
          ? `No ${label} upcoming products detected right now.`
          : `${label} upcoming monitoring is not connected yet.`
      )
    ) +

    accordion(
      `${activeRetailer}-watchlist`,
      "WATCHLIST",
      0,
      emptyAccordionMessage(
        provider.configured
          ? `No ${label} watchlist items are currently returned by the provider.`
          : `${label} watchlist will appear here once its monitor is connected.`
      )
    );

}

function bindAccordions(){

  document
    .querySelectorAll(
      "[data-accordion]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const id =
              button.dataset
                .accordion;

            const container =
              document.getElementById(
                id
              );

            if (
              container
            ){
              container.classList.toggle(
                "open"
              );
            }

          }
        );

      }
    );

}

function renderMonitor(){

  monitorTitle.textContent =
    RETAILER_TITLES[
      activeRetailer
    ] ||
    `${RETAILER_LABELS[activeRetailer]} Monitor`;

  searchEl.placeholder =
    `Search ${RETAILER_LABELS[activeRetailer]} Pokémon products`;

  if (
    activeRetailer ===
    "walmart"
  ){
    renderWalmartMonitor();
  }
  else{
    renderOtherRetailerMonitor();
  }

  bindAccordions();

}

function renderProducts(){

  const query =
    searchEl.value
      .trim()
      .toLowerCase();

  const list =
    currentProducts.filter(
      product => {

        return (
          !query ||
          String(
            product.name ||
            ""
          )
            .toLowerCase()
            .includes(query) ||
          String(
            product.seller ||
            ""
          )
            .toLowerCase()
            .includes(query) ||
          String(
            product.storeName ||
            ""
          )
            .toLowerCase()
            .includes(query)
        );

      }
    );

  visibleCount.textContent =
    `${list.length} product${list.length === 1 ? "" : "s"}`;

  if (
    !list.length
  ){

    const provider =
      providerFor(
        activeRetailer
      );

    productsEl.innerHTML =
      `<div class="empty">` +
      `${
        provider.configured
          ? `No ${esc(provider.label)} inventory returned for this view right now.`
          : `${esc(provider.label)} is not connected yet. No inventory is being fabricated.`
      }` +
      `</div>`;

    return;
  }

  productsEl.innerHTML =
    list.map(
      product => {

        const fallbackImage =
          fallback(
            product.name
          );

        const image =
          product.image ||
          fallbackImage;

        const channel =
          product.channel ===
          "store"
            ? "IN-STORE"
            : "ONLINE";

        const store =
          product.channel ===
          "store"
            ? (
                `<div class="storeline">` +
                `Store: ${esc(product.storeName || "Unknown store")}` +
                `${product.storeId ? ` • ID ${esc(product.storeId)}` : ""}` +
                `${product.quantity != null ? ` • Qty ${esc(product.quantity)}` : ""}` +
                `</div>`
              )
            : "";

        const sellerBadge =
          product.directSeller === true
            ? `<span class="badge good">WALMART DIRECT</span>`
            : product.approvedMarketplace === true
              ? `<span class="badge good">GT COLLECTIBLES</span>`
              : "";

        return (

          `<article class="card">` +

            `<div class="image-wrap">` +

              `<img ` +
                `src="${esc(image)}" ` +
                `alt="${esc(product.name)}" ` +
                `onerror="this.onerror=null;this.src='${fallbackImage}'"` +
              `>` +

              `<div class="image-note">` +
                `${
                  product.image
                    ? "RETAILER IMAGE"
                    : "REPRESENTATIVE IMAGE"
                }` +
              `</div>` +

            `</div>` +

            `<div class="body">` +

              `<div class="badges">` +

                `${statusBadge(product.status)}` +

                `<span class="badge">` +
                  `${channel}` +
                `</span>` +

                `<span class="badge">` +
                  `${esc(
                    product.retailerLabel ||
                    RETAILER_LABELS[
                      product.retailer
                    ] ||
                    product.retailer
                  )}` +
                `</span>` +

                `${sellerBadge}` +

                `${
                  product.stale
                    ? '<span class="badge warn">STALE DISPLAY</span>'
                    : ""
                }` +

              `</div>` +

              `<div class="name">` +
                `${esc(product.name)}` +
              `</div>` +

              `<div class="sub">` +
                `Seller: ${esc(product.seller || "Not provided")}` +
              `</div>` +

              `<div class="price">` +
                `${money(product.price)} ` +

                `<small>` +
                  `${
                    product.msrp != null
                      ? `MSRP ${money(product.msrp)}`
                      : ""
                  }` +
                `</small>` +

              `</div>` +

              `${store}` +

              `<div class="sub">` +
                `Checked: ${product.checkedAt ? new Date(product.checkedAt).toLocaleTimeString() : "—"}` +
                `${product.rawStatus ? ` • Source status: ${esc(product.rawStatus)}` : ""}` +
              `</div>` +

              `${
                product.url
                  ? `<a class="buy" href="${esc(product.url)}" target="_blank" rel="noopener noreferrer">OPEN PRODUCT</a>`
                  : ""
              }` +

            `</div>` +

          `</article>`

        );

      }
    )
    .join("");

}

function setOnline(
  element,
  ok,
  onText,
  offText
){

  element.classList.toggle(
    "offline",
    !ok
  );

  element
    .querySelector(
      "span:last-child"
    )
    .textContent =
      ok
        ? onText
        : offText;

}

async function fetchRetailerProducts(){

  const response =
    await fetch(
      `/api/products?retailer=${encodeURIComponent(activeRetailer)}&t=${Date.now()}`,
      {
        cache:
          "no-store"
      }
    );

  if (
    !response.ok
  ){
    throw new Error(
      `${RETAILER_LABELS[activeRetailer]} inventory request failed`
    );
  }

  const data =
    await response.json();

  currentProducts =
    (
      Array.isArray(
        data.items
      )
        ? data.items
        : []
    )
    .filter(
      product =>
        product.retailer ===
        activeRetailer
    );

}

async function load(){

  refreshBtn.disabled =
    true;

  try{

    const [
      providersResponse,
      statusResponse
    ] =
      await Promise.all(
        [

          fetch(
            `/api/providers?t=${Date.now()}`,
            {
              cache:
                "no-store"
            }
          ),

          fetch(
            `/api/status?t=${Date.now()}`,
            {
              cache:
                "no-store"
            }
          )

        ]
      );

    if (
      !providersResponse.ok ||
      !statusResponse.ok
    ){
      throw new Error(
        "Backend request failed"
      );
    }

    const [
      providersData,
      statusData
    ] =
      await Promise.all(
        [
          providersResponse.json(),
          statusResponse.json()
        ]
      );

    providerStates =
      Array.isArray(
        providersData.providers
      )
        ? providersData.providers
        : [];

    latestStatus =
      statusData ||
      {};

    await fetchRetailerProducts();

    renderMonitor();
    renderProducts();

    setOnline(
      backendStatus,
      true,
      "LIVE MONITOR CONNECTED",
      "MONITOR CONNECTION ERROR"
    );

    setOnline(
      pushStatus,
      Boolean(
        statusData
          ?.push
          ?.configured
      ),
      "PUSH ALERTS ACTIVE",
      "PUSH ALERTS NOT ACTIVE"
    );

    lastUpdated.textContent =
      `Updated ${new Date().toLocaleTimeString()}`;

  }
  catch(error){

    console.error(
      error
    );

    setOnline(
      backendStatus,
      false,
      "LIVE MONITOR CONNECTED",
      "MONITOR CONNECTION ERROR"
    );

  }
  finally{

    refreshBtn.disabled =
      false;

  }

}

async function switchRetailer(
  retailer
){

  activeRetailer =
    retailer;

  searchEl.value =
    "";

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      tab => {

        tab.classList.toggle(
          "active",
          tab.dataset.retailer ===
          retailer
        );

      }
    );

  currentProducts =
    [];

  renderMonitor();
  renderProducts();

  await load();

}

async function runManualWalmartScan(){

  let token =
    localStorage.getItem(
      "pokemonMonitorScanToken"
    ) ||
    "";

  if (
    !token
  ){

    token =
      prompt(
        "Enter your MANUAL_SCAN_TOKEN from Render:"
      ) ||
      "";

    if (
      !token
    ){
      return;
    }

    localStorage.setItem(
      "pokemonMonitorScanToken",
      token
    );

  }

  const button =
    document.getElementById(
      "manualWalmartScan"
    );

  if (
    button
  ){
    button.disabled =
      true;

    button.textContent =
      "SCANNING…";
  }

  try{

    const response =
      await fetch(
        "/api/walmart/scan",
        {
          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-monitor-token":
              token
          },

          body:
            "{}"
        }
      );

    const data =
      await response.json();

    if (
      response.status ===
      401
    ){

      localStorage.removeItem(
        "pokemonMonitorScanToken"
      );

      alert(
        "Scan key was rejected. Tap SCAN WALMART NOW and enter it again."
      );

      return;
    }

    if (
      !response.ok
    ){

      throw new Error(
        data.error ||
        data.result?.reason ||
        "Manual scan failed"
      );

    }

    alert(
      data.result?.skipped
        ? data.result.reason
        : "Walmart scan completed."
    );

    await load();

  }
  catch(error){

    alert(
      error.message
    );

  }
  finally{

    const latestButton =
      document.getElementById(
        "manualWalmartScan"
      );

    if (
      latestButton
    ){
      latestButton.disabled =
        false;

      latestButton.textContent =
        "SCAN WALMART NOW";
    }

  }

}

document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () =>
          switchRetailer(
            button.dataset.retailer
          )
      );

    }
  );

searchEl.addEventListener(
  "input",
  renderProducts
);

refreshBtn.addEventListener(
  "click",
  load
);

setInterval(
  load,
  15000
);

load();

</script>
