<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020711">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pokémon Restock Monitor</title>

<style>
:root{
  --bg:#020711;
  --panel:#071326;
  --panel2:#0a1b31;
  --text:#f7fbff;
  --muted:#96a8bf;
  --green:#54f3a6;
  --blue:#62c7ff;
  --gold:#ffc76b;
  --red:#ff758b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:max(24px,env(safe-area-inset-bottom));
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.app{
  max-width:980px;
  margin:auto;
  overflow:hidden;
}

.hero{
  height:360px;
  background:
    linear-gradient(
      to bottom,
      rgba(2,7,17,0) 58%,
      rgba(2,7,17,.35) 76%,
      var(--bg) 100%
    ),
    url("hero.jpg") center top/cover no-repeat;
}

.status-wrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  padding:0 14px;
  margin-top:-28px;
  position:relative;
  z-index:2;
}

.status-pill{
  min-height:46px;
  cursor:pointer;
  border:1px solid rgba(84,243,166,.55);
  border-radius:12px;
  background:rgba(8,44,37,.96);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:12px;
  font-weight:900;
}

.status-pill.offline{
  border-color:rgba(255,117,139,.55);
  background:rgba(57,19,29,.96);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
}

.offline .dot{
  background:var(--red);
  box-shadow:0 0 8px var(--red);
}

.section{
  padding:12px 14px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
}

.tab{
  border:1px solid rgba(98,199,255,.25);
  border-radius:10px;
  background:var(--panel);
  color:#dcecff;
  padding:11px 6px;
  font-size:11px;
  font-weight:900;
}

.tab.active{
  border-color:var(--green);
  background:#0d2f2a;
  color:white;
}

.monitor-panel{
  border:1px solid rgba(98,199,255,.24);
  border-radius:14px;
  background:linear-gradient(180deg,#0b1d34,#071326);
  padding:14px;
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.panel-title{
  font-size:14px;
  font-weight:900;
}

.panel-status{
  font-size:10px;
  font-weight:900;
  padding:5px 8px;
  border-radius:999px;
  border:1px solid rgba(84,243,166,.35);
  color:var(--green);
}

.panel-status.warn{
  border-color:rgba(255,199,107,.4);
  color:var(--gold);
}

.panel-status.off{
  border-color:rgba(255,117,139,.4);
  color:var(--red);
}

.schedule-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.schedule-box{
  background:#06111f;
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;
  padding:10px;
}

.schedule-box span{
  display:block;
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  font-weight:800;
}

.schedule-box strong{
  display:block;
  margin-top:4px;
  font-size:12px;
}

.panel-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.action-btn{
  flex:1;
  border:1px solid rgba(84,243,166,.45);
  background:#0b2b25;
  color:white;
  border-radius:10px;
  padding:11px;
  font-weight:900;
}

.action-btn.secondary{
  border-color:rgba(98,199,255,.35);
  background:#0a1b31;
}

.upcoming-wrap{
  margin-top:12px;
}

.upcoming-title{
  font-size:11px;
  font-weight:900;
  color:#dcecff;
}

.upcoming-list{
  display:grid;
  gap:7px;
  margin-top:7px;
}

.upcoming-item{
  border:1px solid rgba(255,199,107,.28);
  border-radius:9px;
  padding:9px;
  background:#17140c;
}

.upcoming-item strong{
  font-size:11px;
}

.upcoming-item small{
  display:block;
  margin-top:3px;
  color:var(--muted);
}

.upcoming-item.watch{
  border-color:rgba(98,199,255,.25);
  background:#081522;
}

.healthline{
  margin-top:9px;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

.toolbar{
  display:flex;
  gap:8px;
  align-items:center;
}

.toolbar input{
  flex:1;
  min-width:0;
  background:var(--panel);
  border:1px solid rgba(98,199,255,.25);
  color:white;
  border-radius:10px;
  padding:12px;
}

.toolbar button{
  border:1px solid rgba(84,243,166,.45);
  background:#0b2b25;
  color:#e9fff5;
  border-radius:10px;
  padding:12px 16px;
  font-weight:900;
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  padding:4px 14px 20px;
}

.card{
  border:1px solid rgba(98,199,255,.18);
  border-radius:14px;
  background:linear-gradient(180deg,#09192d,#06111f);
  overflow:hidden;
}

.image-wrap{
  aspect-ratio:1.35/1;
  background:#08111e;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.image-wrap img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.image-note{
  position:absolute;
  bottom:7px;
  left:7px;
  background:rgba(2,7,17,.8);
  border:1px solid rgba(255,255,255,.14);
  border-radius:6px;
  padding:4px 6px;
  font-size:9px;
  font-weight:900;
}

.body{
  padding:12px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.badge{
  display:inline-flex;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.18);
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}

.badge.good{
  border-color:rgba(84,243,166,.5);
  color:var(--green);
}

.badge.warn{
  border-color:rgba(255,199,107,.5);
  color:var(--gold);
}

.badge.out{
  border-color:rgba(255,117,139,.5);
  color:var(--red);
}

.name{
  margin-top:9px;
  font-size:15px;
  font-weight:900;
  line-height:1.3;
}

.sub{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.price{
  margin-top:10px;
  font-size:21px;
  font-weight:900;
}

.price small{
  font-size:11px;
  color:var(--muted);
  font-weight:700;
}

.storeline{
  margin-top:8px;
  color:#dcecff;
  font-size:11px;
}

.buy{
  display:block;
  margin-top:11px;
  text-align:center;
  border:1px solid rgba(84,243,166,.5);
  border-radius:9px;
  background:#0c3128;
  padding:10px;
  font-size:11px;
  font-weight:900;
}

.empty{
  grid-column:1/-1;
  border:1px dashed rgba(98,199,255,.25);
  border-radius:12px;
  padding:28px;
  text-align:center;
  color:var(--muted);
}

.store-placeholder{
  margin-top:12px;
  border:1px dashed rgba(98,199,255,.25);
  border-radius:12px;
  padding:22px;
  text-align:center;
  color:var(--muted);
  line-height:1.5;
}

.hidden{
  display:none!important;
}

@media(max-width:760px){
  .tabs{
    grid-template-columns:repeat(2,1fr);
  }

  .tabs .tab:last-child{
    grid-column:1/-1;
  }

  .schedule-grid{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr;
  }

  .hero{
    height:320px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="hero"></div>

  <div class="status-wrap">

    <div id="backendStatus" class="status-pill">
      <span class="dot"></span>
      <span>LIVE MONITOR CONNECTED</span>
    </div>

    <div
      id="pushStatus"
      class="status-pill offline"
      role="button"
      tabindex="0"
      aria-label="Enable push alerts"
    >
      <span class="dot"></span>
      <span>CHECKING PUSH ALERTS…</span>
    </div>

  </div>

  <section class="section">

    <div class="tabs">

      <button class="tab active" data-retailer="walmart">
        WALMART
      </button>

      <button class="tab" data-retailer="target">
        TARGET
      </button>

      <button class="tab" data-retailer="sams">
        SAM'S CLUB
      </button>

      <button class="tab" data-retailer="bestbuy">
        BEST BUY
      </button>

      <button class="tab" data-retailer="costco">
        COSTCO
      </button>

    </div>

  </section>

  <section class="section">

    <div id="retailerMonitor" class="monitor-panel">

      <div class="panel-head">

        <div id="monitorTitle" class="panel-title">
          Walmart Drop Monitor
        </div>

        <div id="monitorState" class="panel-status">
          SCHEDULED
        </div>

      </div>

      <div id="walmartDetails">

        <div class="schedule-grid">

          <div class="schedule-box">
            <span>Drop window</span>
            <strong id="walmartSchedule">Loading…</strong>
          </div>

          <div class="schedule-box">
            <span>Primary source</span>
            <strong id="walmartPrimary">Loading…</strong>
          </div>

          <div class="schedule-box">
            <span>Last scheduled scan</span>
            <strong id="walmartLastScan">—</strong>
          </div>

          <div class="schedule-box">
            <span>Next scan</span>
            <strong id="walmartNextScan">—</strong>
          </div>

        </div>

        <div class="panel-actions">

          <button id="manualWalmartScan" class="action-btn">
            SCAN WALMART NOW
          </button>

          <button id="forgetScanToken" class="action-btn secondary">
            RESET SCAN KEY
          </button>

        </div>

        <div id="walmartHealth" class="healthline">
          Provider health loading…
        </div>

        <div class="upcoming-wrap">

          <div class="upcoming-title">
            DETECTED UPCOMING + WATCHLIST
          </div>

          <div id="upcomingList" class="upcoming-list">
            <div class="sub">
              Loading Walmart watchlist…
            </div>
          </div>

        </div>

      </div>

      <div id="otherRetailerDetails" class="hidden">

        <div
          id="otherRetailerMessage"
          class="store-placeholder"
        ></div>

      </div>

    </div>

  </section>

  <section class="section">

    <div class="toolbar">

      <input
        id="search"
        placeholder="Search Walmart Pokémon products"
      >

      <button id="refresh">
        Refresh
      </button>

    </div>

    <div class="meta">

      <span id="visibleCount">
        0 products
      </span>

      <span id="lastUpdated">
        Not updated yet
      </span>

    </div>

  </section>

  <main
    id="products"
    class="products"
  ></main>

</div>

<script>

const RETAILER_LABELS={
  walmart:"Walmart",
  target:"Target",
  sams:"Sam's Club",
  bestbuy:"Best Buy",
  costco:"Costco"
};

const RETAILER_MONITOR_NAMES={
  walmart:"Walmart Drop Monitor",
  target:"Target Online Monitor",
  sams:"Sam's Club Monitor",
  bestbuy:"Best Buy Monitor",
  costco:"Costco Monitor"
};

const productsEl=
  document.getElementById("products");

const searchEl=
  document.getElementById("search");

const refreshBtn=
  document.getElementById("refresh");

const backendStatus=
  document.getElementById("backendStatus");

const pushStatus=
  document.getElementById("pushStatus");

const visibleCount=
  document.getElementById("visibleCount");

const lastUpdated=
  document.getElementById("lastUpdated");

const manualWalmartScan=
  document.getElementById("manualWalmartScan");

const forgetScanToken=
  document.getElementById("forgetScanToken");

const walmartSchedule=
  document.getElementById("walmartSchedule");

const walmartPrimary=
  document.getElementById("walmartPrimary");

const walmartLastScan=
  document.getElementById("walmartLastScan");

const walmartNextScan=
  document.getElementById("walmartNextScan");

const walmartHealth=
  document.getElementById("walmartHealth");

const upcomingList=
  document.getElementById("upcomingList");

const monitorTitle=
  document.getElementById("monitorTitle");

const monitorState=
  document.getElementById("monitorState");

const walmartDetails=
  document.getElementById("walmartDetails");

const otherRetailerDetails=
  document.getElementById("otherRetailerDetails");

const otherRetailerMessage=
  document.getElementById("otherRetailerMessage");

let activeRetailer="walmart";
let currentProducts=[];
let providerStates=[];
let latestStatus={};


/* ========================================
   BASIC HELPERS
======================================== */

function esc(value){

  return String(value??"")
    .replace(/[&<>"']/g,c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#39;"

    })[c]);

}


function money(value){

  const n=Number(value);

  return Number.isFinite(n)
    ?new Intl.NumberFormat(
        "en-US",
        {
          style:"currency",
          currency:"USD"
        }
      ).format(n)
    :"Price unavailable";

}


/*
  Formats backend ISO dates such as:

  2026-10-05T15:40:00.000Z

  into the iPhone/browser's local time, such as:

  10/5/2026, 10:40:00 AM
*/
function formatDateTime(value){

  if(!value){
    return "—";
  }

  const date=new Date(value);

  if(Number.isNaN(date.getTime())){
    return String(value);
  }

  return date.toLocaleString(
    "en-US",
    {
      month:"numeric",
      day:"numeric",
      year:"numeric",
      hour:"numeric",
      minute:"2-digit",
      second:"2-digit"
    }
  );

}


function fallback(name){

  const label=
    esc(name||"Pokémon product")
      .slice(0,42);

  const svg=
    `<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520">
      <rect width="100%" height="100%" fill="#071729"/>
      <circle cx="350" cy="210" r="110" fill="#0d3151"/>
      <text
        x="350"
        y="205"
        text-anchor="middle"
        fill="white"
        font-size="28"
        font-family="Arial"
        font-weight="700"
      >${label}</text>
      <text
        x="350"
        y="340"
        text-anchor="middle"
        fill="#54f3a6"
        font-size="22"
        font-family="Arial"
        font-weight="700"
      >REPRESENTATIVE IMAGE</text>
      <text
        x="350"
        y="375"
        text-anchor="middle"
        fill="#9aa9c1"
        font-size="16"
        font-family="Arial"
      >Retailer image unavailable</text>
    </svg>`;

  return "data:image/svg+xml;charset=UTF-8,"+
    encodeURIComponent(svg);

}


function statusBadge(status){

  const n=
    String(status||"out")
      .toLowerCase();

  const cls=
    ["instock","onhand"].includes(n)
      ?"good"
      :[
          "transit",
          "ordered",
          "preorder",
          "watching"
        ].includes(n)
        ?"warn"
        :"out";

  return `
    <span class="badge ${cls}">
      ${esc(n)}
    </span>
  `;

}


function providerFor(retailer){

  return providerStates.find(
    p=>p.retailer===retailer
  )||{

    retailer,

    label:
      RETAILER_LABELS[retailer]||
      retailer,

    configured:false,
    running:false,
    error:null,
    itemCount:0,
    lastRun:null

  };

}


/* ========================================
   UPCOMING / WATCHLIST
======================================== */

function renderUpcoming(
  watchData,
  legacyItems=[]
){

  const detected=
    Array.isArray(watchData?.detected)
      ?watchData.detected
      :(Array.isArray(legacyItems)
        ?legacyItems
        :[]);

  const watching=
    Array.isArray(watchData?.watching)
      ?watchData.watching
      :[];

  const rows=[];


  for(
    const item of detected.slice(0,8)
  ){

    rows.push(`
      <a
        class="upcoming-item"
        href="${esc(item.url||'#')}"
        ${
          item.url
            ?'target="_blank" rel="noopener noreferrer"'
            :''
        }
      >
        <strong>
          ${esc(item.name)}
        </strong>

        <small>
          ${
            esc(
              (
                item.dropType||
                item.status||
                "upcoming"
              ).toUpperCase()
            )
          }
          ${
            item.price!=null
              ?` • ${money(item.price)}`
              :""
          }
          ${
            item.rawStatus
              ?` • ${esc(item.rawStatus)}`
              :""
          }
        </small>
      </a>
    `);

  }


  for(
    const item of watching.slice(0,18)
  ){

    rows.push(`
      <a
        class="upcoming-item watch"
        href="${esc(item.url||'#')}"
        ${
          item.url
            ?'target="_blank" rel="noopener noreferrer"'
            :''
        }
      >
        <strong>
          ${esc(item.name)}
        </strong>

        <small>
          WATCHING • Not claiming live availability
          ${
            item.msrp!=null
              ?` • MSRP ${money(item.msrp)}`
              :""
          }
        </small>
      </a>
    `);

  }


  upcomingList.innerHTML=
    rows.length
      ?rows.join("")
      :`
        <div class="sub">
          No Walmart watchlist items configured.
        </div>
      `;

}


/* ========================================
   RETAIL MONITOR
======================================== */

function renderMonitor(){

  const provider=
    providerFor(activeRetailer);

  monitorTitle.textContent=
    RETAILER_MONITOR_NAMES[activeRetailer]||
    `${RETAILER_LABELS[activeRetailer]} Monitor`;

  searchEl.placeholder=
    `Search ${RETAILER_LABELS[activeRetailer]} Pokémon products`;


  if(activeRetailer==="walmart"){

    walmartDetails
      .classList
      .remove("hidden");

    otherRetailerDetails
      .classList
      .add("hidden");


    const schedule=
      latestStatus?.walmartSchedule||{};

    const walmartProvider=
      latestStatus?.walmartProvider||{};

    const hd=
      walmartProvider?.health?.hasdata||{};

    const ra=
      walmartProvider?.health?.rapidapi||{};


    monitorState.className=
      "panel-status";

    monitorState.textContent=
      schedule.activeWindow
        ?"DROP WINDOW ACTIVE"
        :"SCHEDULED";


    walmartSchedule.textContent=
      schedule.scheduleLabel||
      "Wednesday drop window";


    walmartPrimary.textContent=
      walmartProvider.primary
        ?`${String(
            walmartProvider.primary
          ).toUpperCase()}${
            walmartProvider.fallbackEnabled
              ?" → RAPIDAPI FALLBACK"
              :""
          }`
        :"WALMART";


    /*
      LAST SCAN
      Now always goes through the same formatter.
    */
    walmartLastScan.textContent=
      formatDateTime(
        schedule.lastScheduledRun
      );


    /*
      NEXT SCAN FIX

      Backend can return nextScanLabel as:
      2026-10-05T15:40:00.000Z

      This converts it into the phone's
      local timezone before displaying it.
    */
    walmartNextScan.textContent=
      formatDateTime(
        schedule.nextScanLabel||
        schedule.nextScan||
        schedule.nextScheduledRun
      );


    walmartHealth.textContent=
      `HasData: ${
        Number(hd.successes||0)
      } ok / ${
        Number(hd.failures||0)
      } failed • RapidAPI: ${
        Number(ra.successes||0)
      } ok / ${
        Number(ra.failures||0)
      } failed`+
      (
        hd.lastError
          ?` • Last HasData error: ${
              hd.lastError
            }`
          :""
      )+
      (
        ra.lastError
          ?` • Last RapidAPI error: ${
              ra.lastError
            }`
          :""
      );


    renderUpcoming(
      latestStatus?.walmartWatchlist,
      latestStatus?.upcoming||[]
    );

    return;

  }


  walmartDetails
    .classList
    .add("hidden");

  otherRetailerDetails
    .classList
    .remove("hidden");


  if(provider.configured){

    monitorState.className=
      provider.error
        ?"panel-status off"
        :provider.running
          ?"panel-status warn"
          :"panel-status";

    monitorState.textContent=
      provider.error
        ?"ERROR"
        :provider.running
          ?"SCANNING"
          :"CONNECTED";


    otherRetailerMessage.innerHTML=
      `<strong>${esc(provider.label)} monitor connected.</strong><br>`+
      `Live products: ${Number(provider.itemCount||0)}<br>`+
      `Last scan: ${
        provider.lastRun
          ?formatDateTime(provider.lastRun)
          :"—"
      }`+
      (
        provider.error
          ?`<br>Error: ${esc(provider.error)}`
          :""
      );

  }else{

    monitorState.className=
      "panel-status off";

    monitorState.textContent=
      "NOT CONFIGURED";

    otherRetailerMessage.innerHTML=
      `<strong>${esc(provider.label)} is not connected yet.</strong><br>`+
      `This tab is intentionally separate so ${esc(provider.label)} inventory will only appear here once its monitor is connected.`;

  }

}


/* ========================================
   PRODUCT CARDS
======================================== */

function renderProducts(){

  const query=
    searchEl.value
      .trim()
      .toLowerCase();


  const list=
    currentProducts.filter(
      product=>{

        return (
          !query||
          String(product.name||"")
            .toLowerCase()
            .includes(query)||
          String(product.seller||"")
            .toLowerCase()
            .includes(query)||
          String(product.storeName||"")
            .toLowerCase()
            .includes(query)
        );

      }
    );


  visibleCount.textContent=
    `${list.length} product${
      list.length===1
        ?""
        :"s"
    }`;


  if(!list.length){

    const provider=
      providerFor(activeRetailer);

    productsEl.innerHTML=
      `<div class="empty">${
        provider.configured
          ?`No ${esc(provider.label)} inventory returned for this view right now.`
          :`${esc(provider.label)} is not connected yet. No inventory is being fabricated.`
      }</div>`;

    return;

  }


  productsEl.innerHTML=
    list.map(
      product=>{

        const fallbackImage=
          fallback(product.name);

        const image=
          product.image||
          fallbackImage;

        const channel=
          product.channel==="store"
            ?"IN-STORE"
            :"ONLINE";

        const store=
          product.channel==="store"
            ?`
              <div class="storeline">
                Store:
                ${esc(product.storeName||"Unknown store")}
                ${
                  product.storeId
                    ?` • ID ${esc(product.storeId)}`
                    :""
                }
                ${
                  product.quantity!=null
                    ?` • Qty ${esc(product.quantity)}`
                    :""
                }
              </div>
            `
            :"";


        return `
          <article class="card">

            <div class="image-wrap">

              <img
                src="${esc(image)}"
                alt="${esc(product.name)}"
                onerror="
                  this.onerror=null;
                  this.src='${fallbackImage}'
                "
              >

              <div class="image-note">
                ${
                  product.image
                    ?"RETAILER IMAGE"
                    :"REPRESENTATIVE IMAGE"
                }
              </div>

            </div>


            <div class="body">

              <div class="badges">

                ${statusBadge(product.status)}

                <span class="badge">
                  ${channel}
                </span>

                <span class="badge">
                  ${
                    esc(
                      product.retailerLabel||
                      RETAILER_LABELS[
                        product.retailer
                      ]||
                      product.retailer
                    )
                  }
                </span>

                ${
                  product.stale
                    ?'<span class="badge warn">STALE DISPLAY</span>'
                    :''
                }

              </div>


              <div class="name">
                ${esc(product.name)}
              </div>


              <div class="sub">
                Seller:
                ${esc(
                  product.seller||
                  "Not provided"
                )}
              </div>


              <div class="price">

                ${money(product.price)}

                <small>
                  ${
                    product.msrp!=null
                      ?`MSRP ${money(product.msrp)}`
                      :""
                  }
                </small>

              </div>


              ${store}


              <div class="sub">

                Checked:
                ${
                  product.checkedAt
                    ?new Date(
                        product.checkedAt
                      ).toLocaleTimeString()
                    :"—"
                }

                ${
                  product.rawStatus
                    ?` • Source status: ${esc(product.rawStatus)}`
                    :""
                }

              </div>


              ${
                product.url
                  ?`
                    <a
                      class="buy"
                      href="${esc(product.url)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      OPEN PRODUCT
                    </a>
                  `
                  :""
              }

            </div>

          </article>
        `;

      }
    ).join("");

}


/* ========================================
   CONNECTION STATUS
======================================== */

function setOnline(
  element,
  ok,
  onText,
  offText
){

  element.classList.toggle(
    "offline",
    !ok
  );

  element
    .querySelector("span:last-child")
    .textContent=
      ok
        ?onText
        :offText;

}


/* ========================================
   PUSH NOTIFICATIONS
======================================== */

function urlBase64ToUint8Array(
  base64String
){

  const padding=
    "=".repeat(
      (
        4-base64String.length%4
      )%4
    );

  const base64=
    (base64String+padding)
      .replace(/-/g,"+")
      .replace(/_/g,"/");

  const raw=
    atob(base64);

  return Uint8Array.from(
    [...raw].map(
      ch=>ch.charCodeAt(0)
    )
  );

}


function setPushState(
  ok,
  text
){

  pushStatus.classList.toggle(
    "offline",
    !ok
  );

  pushStatus
    .querySelector("span:last-child")
    .textContent=
      text;

}


async function ensurePushSubscription(
  requestPermission=false
){

  if(
    !("serviceWorker" in navigator)||
    !("PushManager" in window)||
    !("Notification" in window)
  ){

    setPushState(
      false,
      "PUSH NOT SUPPORTED"
    );

    return false;

  }


  if(
    requestPermission &&
    Notification.permission==="default"
  ){

    const permission=
      await Notification
        .requestPermission();

    if(permission!=="granted"){

      setPushState(
        false,
        "PUSH PERMISSION NEEDED"
      );

      return false;

    }

  }


  if(
    Notification.permission!=="granted"
  ){

    setPushState(
      false,
      "TAP TO ENABLE ALERTS"
    );

    return false;

  }


  try{

    setPushState(
      false,
      "CONNECTING ALERTS…"
    );


    const registration=
      await navigator
        .serviceWorker
        .register(
          "/sw.js",
          {
            scope:"/"
          }
        );


    await navigator
      .serviceWorker
      .ready;


    const keyResponse=
      await fetch(
        `/api/push/public-key?t=${Date.now()}`,
        {
          cache:"no-store"
        }
      );


    if(!keyResponse.ok){

      throw new Error(
        "Push key unavailable"
      );

    }


    const keyData=
      await keyResponse.json();


    let subscription=
      await registration
        .pushManager
        .getSubscription();


    if(!subscription){

      subscription=
        await registration
          .pushManager
          .subscribe({

            userVisibleOnly:true,

            applicationServerKey:
              urlBase64ToUint8Array(
                keyData.publicKey
              )

          });

    }


    const saveResponse=
      await fetch(
        "/api/push/subscribe",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              subscription
            )

        }
      );


    if(!saveResponse.ok){

      const details=
        await saveResponse
          .json()
          .catch(()=>({}));

      throw new Error(
        details.error||
        "Push subscription save failed"
      );

    }


    setPushState(
      true,
      "PUSH ALERTS ACTIVE"
    );

    return true;

  }catch(error){

    console.error(
      "Push setup failed:",
      error
    );

    setPushState(
      false,
      "TAP TO RETRY ALERTS"
    );

    return false;

  }

}


async function initializePush(){

  if(
    Notification.permission==="granted"
  ){

    await ensurePushSubscription(
      false
    );

  }else if(
    Notification.permission==="denied"
  ){

    setPushState(
      false,
      "PUSH BLOCKED IN SETTINGS"
    );

  }else{

    setPushState(
      false,
      "TAP TO ENABLE ALERTS"
    );

  }

}


/* ========================================
   FETCH RETAILER PRODUCTS
======================================== */

async function fetchRetailerProducts(){

  const response=
    await fetch(
      `/api/products?retailer=${
        encodeURIComponent(
          activeRetailer
        )
      }&t=${Date.now()}`,
      {
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      `${
        RETAILER_LABELS[
          activeRetailer
        ]
      } inventory request failed`
    );

  }


  const data=
    await response.json();


  currentProducts=
    Array.isArray(data.items)
      ?data.items
      :[];

}


/* ========================================
   MAIN DASHBOARD LOAD
======================================== */

async function load(){

  refreshBtn.disabled=true;


  try{

    const [
      providersResponse,
      statusResponse
    ]=
      await Promise.all([

        fetch(
          `/api/providers?t=${Date.now()}`,
          {
            cache:"no-store"
          }
        ),

        fetch(
          `/api/status?t=${Date.now()}`,
          {
            cache:"no-store"
          }
        )

      ]);


    if(
      !providersResponse.ok||
      !statusResponse.ok
    ){

      throw new Error(
        "Backend request failed"
      );

    }


    const [
      providersData,
      statusData
    ]=
      await Promise.all([

        providersResponse.json(),
        statusResponse.json()

      ]);


    providerStates=
      Array.isArray(
        providersData.providers
      )
        ?providersData.providers
        :[];


    latestStatus=
      statusData||{};


    await fetchRetailerProducts();


    renderMonitor();
    renderProducts();


    setOnline(
      backendStatus,
      true,
      "LIVE MONITOR CONNECTED",
      "MONITOR CONNECTION ERROR"
    );


    if(!statusData?.push?.configured){

      setPushState(
        false,
        "PUSH SERVER NOT CONFIGURED"
      );

    }


    lastUpdated.textContent=
      `Updated ${
        new Date()
          .toLocaleTimeString()
      }`;


  }catch(error){

    console.error(error);


    setOnline(
      backendStatus,
      false,
      "LIVE MONITOR CONNECTED",
      "MONITOR CONNECTION ERROR"
    );


  }finally{

    refreshBtn.disabled=false;

  }

}


/* ========================================
   RETAILER SWITCHING
======================================== */

async function switchRetailer(
  retailer
){

  activeRetailer=
    retailer;

  searchEl.value="";


  document
    .querySelectorAll(".tab")
    .forEach(
      tab=>{

        tab.classList.toggle(
          "active",
          tab.dataset.retailer===
            retailer
        );

      }
    );


  currentProducts=[];

  renderMonitor();
  renderProducts();

  await load();

}


/* ========================================
   MANUAL WALMART SCAN
======================================== */

async function runManualWalmartScan(){

  let token=
    localStorage.getItem(
      "pokemonMonitorScanToken"
    )||"";


  if(!token){

    token=
      prompt(
        "Enter your MANUAL_SCAN_TOKEN from Render:"
      )||"";


    if(!token){
      return;
    }


    localStorage.setItem(
      "pokemonMonitorScanToken",
      token
    );

  }


  manualWalmartScan.disabled=true;

  manualWalmartScan.textContent=
    "SCANNING…";


  try{

    const response=
      await fetch(
        "/api/walmart/scan",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-monitor-token":
              token
          },

          body:"{}"

        }
      );


    const data=
      await response.json();


    if(response.status===401){

      localStorage.removeItem(
        "pokemonMonitorScanToken"
      );


      alert(
        "Scan key was rejected. Tap SCAN WALMART NOW and enter it again."
      );

      return;

    }


    if(!response.ok){

      throw new Error(
        data.error||
        data.result?.reason||
        "Manual scan failed"
      );

    }


    alert(
      data.result?.skipped
        ?data.result.reason
        :"Walmart scan completed."
    );


    await load();


  }catch(error){

    alert(error.message);


  }finally{

    manualWalmartScan.disabled=false;

    manualWalmartScan.textContent=
      "SCAN WALMART NOW";

  }

}


/* ========================================
   EVENT LISTENERS
======================================== */

document
  .querySelectorAll(".tab")
  .forEach(
    button=>{

      button.addEventListener(
        "click",
        ()=>switchRetailer(
          button.dataset.retailer
        )
      );

    }
  );


searchEl.addEventListener(
  "input",
  renderProducts
);


refreshBtn.addEventListener(
  "click",
  load
);


manualWalmartScan.addEventListener(
  "click",
  runManualWalmartScan
);


forgetScanToken.addEventListener(
  "click",
  ()=>{

    localStorage.removeItem(
      "pokemonMonitorScanToken"
    );

    alert(
      "Saved scan key cleared."
    );

  }
);


pushStatus.addEventListener(
  "click",
  ()=>ensurePushSubscription(true)
);


pushStatus.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter"||
      event.key===" "
    ){

      event.preventDefault();

      ensurePushSubscription(true);

    }

  }
);


/* ========================================
   AUTO REFRESH
======================================== */

setInterval(
  load,
  15000
);


load();
initializePush();

</script>
