<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#020711">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<title>Pokémon Restock Monitor</title>

<style>
:root{
  --bg:#020711;
  --panel:#071326;
  --panel2:#0a1b31;
  --text:#f7fbff;
  --muted:#96a8bf;
  --green:#54f3a6;
  --blue:#62c7ff;
  --gold:#ffc76b;
  --red:#ff758b;
  --purple:#bb8cff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:
    max(
      24px,
      env(safe-area-inset-bottom)
    );
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.app{
  max-width:980px;
  margin:auto;
  overflow:hidden;
}


/* ========================================
   HERO
======================================== */

.hero{
  height:360px;

  background:
    linear-gradient(
      to bottom,
      rgba(2,7,17,0) 58%,
      rgba(2,7,17,.35) 76%,
      var(--bg) 100%
    ),
    url("hero.jpg")
    center top/
    cover
    no-repeat;
}


/* ========================================
   TOP STATUS
======================================== */

.status-wrap{
  display:grid;
  grid-template-columns:
    1fr 1fr;

  gap:9px;

  padding:
    0 14px;

  margin-top:
    -28px;

  position:relative;
  z-index:2;
}

.status-pill{
  min-height:46px;

  cursor:pointer;

  border:
    1px solid
    rgba(84,243,166,.55);

  border-radius:12px;

  background:
    rgba(8,44,37,.96);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  font-size:12px;
  font-weight:900;
}

.status-pill.offline{
  border-color:
    rgba(255,117,139,.55);

  background:
    rgba(57,19,29,.96);
}

.dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:
    var(--green);

  box-shadow:
    0 0 8px
    var(--green);
}

.offline .dot{
  background:
    var(--red);

  box-shadow:
    0 0 8px
    var(--red);
}


/* ========================================
   GENERAL
======================================== */

.section{
  padding:
    12px 14px;
}


/* ========================================
   RETAILER TABS
======================================== */

.tabs{
  display:grid;

  grid-template-columns:
    repeat(
      5,
      minmax(0,1fr)
    );

  gap:7px;
}

.tab{
  border:
    1px solid
    rgba(98,199,255,.25);

  border-radius:10px;

  background:
    var(--panel);

  color:#dcecff;

  padding:
    11px 6px;

  font-size:11px;
  font-weight:900;
}

.tab.active{
  border-color:
    var(--green);

  background:#0d2f2a;

  color:white;
}


/* ========================================
   WALMART SUB TABS
======================================== */

.walmart-subtabs{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:12px;
}

.walmart-subtab{
  border:
    1px solid
    rgba(98,199,255,.27);

  background:
    #071629;

  color:
    #aebed0;

  border-radius:10px;

  padding:
    10px;

  font-size:11px;
  font-weight:900;
}

.walmart-subtab.active{
  border-color:
    var(--green);

  color:white;

  background:
    #0b3028;

  box-shadow:
    inset 0 0 0 1px
    rgba(84,243,166,.08);
}

.walmart-subtab.raffles.active{
  border-color:
    var(--gold);

  color:
    var(--gold);

  background:
    #2a210d;
}


/* ========================================
   MONITOR PANEL
======================================== */

.monitor-panel{
  border:
    1px solid
    rgba(98,199,255,.24);

  border-radius:14px;

  background:
    linear-gradient(
      180deg,
      #0b1d34,
      #071326
    );

  padding:14px;
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:
    space-between;

  gap:10px;
}

.panel-title{
  font-size:14px;
  font-weight:900;
}

.panel-status{
  font-size:10px;
  font-weight:900;

  padding:
    5px 8px;

  border-radius:
    999px;

  border:
    1px solid
    rgba(84,243,166,.35);

  color:
    var(--green);
}

.panel-status.warn{
  border-color:
    rgba(255,199,107,.4);

  color:
    var(--gold);
}

.panel-status.off{
  border-color:
    rgba(255,117,139,.4);

  color:
    var(--red);
}

.schedule-grid{
  display:grid;

  grid-template-columns:
    repeat(
      4,
      1fr
    );

  gap:8px;

  margin-top:10px;
}

.schedule-box{
  background:
    #06111f;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:10px;

  padding:10px;
}

.schedule-box span{
  display:block;

  color:
    var(--muted);

  font-size:9px;

  text-transform:
    uppercase;

  font-weight:800;
}

.schedule-box strong{
  display:block;

  margin-top:4px;

  font-size:12px;
}

.panel-actions{
  display:flex;

  gap:8px;

  margin-top:10px;
}

.action-btn{
  flex:1;

  border:
    1px solid
    rgba(84,243,166,.45);

  background:
    #0b2b25;

  color:white;

  border-radius:10px;

  padding:11px;

  font-weight:900;
}

.action-btn.secondary{
  border-color:
    rgba(98,199,255,.35);

  background:
    #0a1b31;
}

.upcoming-wrap{
  margin-top:12px;
}

.upcoming-title{
  font-size:11px;
  font-weight:900;
  color:#dcecff;
}

.upcoming-list{
  display:grid;

  gap:7px;

  margin-top:7px;
}

.upcoming-item{
  border:
    1px solid
    rgba(255,199,107,.28);

  border-radius:9px;

  padding:9px;

  background:
    #17140c;
}

.upcoming-item strong{
  font-size:11px;
}

.upcoming-item small{
  display:block;

  margin-top:3px;

  color:
    var(--muted);
}

.upcoming-item.watch{
  border-color:
    rgba(98,199,255,.25);

  background:
    #081522;
}

.healthline{
  margin-top:9px;

  color:
    var(--muted);

  font-size:10px;

  line-height:1.5;
}


/* ========================================
   TOOLBAR
======================================== */

.toolbar{
  display:flex;

  gap:8px;

  align-items:center;
}

.toolbar input{
  flex:1;
  min-width:0;

  background:
    var(--panel);

  border:
    1px solid
    rgba(98,199,255,.25);

  color:white;

  border-radius:10px;

  padding:12px;
}

.toolbar button{
  border:
    1px solid
    rgba(84,243,166,.45);

  background:
    #0b2b25;

  color:
    #e9fff5;

  border-radius:10px;

  padding:
    12px 16px;

  font-weight:900;
}

.meta{
  display:flex;

  justify-content:
    space-between;

  gap:10px;

  margin-top:8px;

  color:
    var(--muted);

  font-size:11px;
}


/* ========================================
   PRODUCTS
======================================== */

.products{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:12px;

  padding:
    4px 14px 20px;
}

.card{
  border:
    1px solid
    rgba(98,199,255,.18);

  border-radius:14px;

  background:
    linear-gradient(
      180deg,
      #09192d,
      #06111f
    );

  overflow:hidden;
}

.card.raffle-card{
  border-color:
    rgba(255,199,107,.28);

  background:
    linear-gradient(
      180deg,
      #17140c,
      #08111e
    );
}

.card.raffle-card.live{
  border-color:
    rgba(84,243,166,.65);

  box-shadow:
    0 0 22px
    rgba(84,243,166,.12);
}

.image-wrap{
  aspect-ratio:
    1.35 / 1;

  background:
    #08111e;

  display:flex;

  align-items:center;
  justify-content:center;

  position:relative;
}

.image-wrap img{
  width:100%;
  height:100%;

  object-fit:
    contain;
}

.image-note{
  position:absolute;

  bottom:7px;
  left:7px;

  background:
    rgba(2,7,17,.8);

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius:6px;

  padding:
    4px 6px;

  font-size:9px;
  font-weight:900;
}

.body{
  padding:12px;
}

.badges{
  display:flex;

  flex-wrap:wrap;

  gap:6px;
}

.badge{
  display:inline-flex;

  border-radius:
    999px;

  border:
    1px solid
    rgba(255,255,255,.18);

  padding:
    4px 7px;

  font-size:9px;

  font-weight:900;

  text-transform:
    uppercase;
}

.badge.good{
  border-color:
    rgba(84,243,166,.5);

  color:
    var(--green);
}

.badge.warn{
  border-color:
    rgba(255,199,107,.5);

  color:
    var(--gold);
}

.badge.out{
  border-color:
    rgba(255,117,139,.5);

  color:
    var(--red);
}

.badge.detected{
  border-color:
    rgba(187,140,255,.55);

  color:
    var(--purple);
}

.name{
  margin-top:9px;

  font-size:15px;

  font-weight:900;

  line-height:1.3;
}

.sub{
  margin-top:4px;

  color:
    var(--muted);

  font-size:11px;
}

.price{
  margin-top:10px;

  font-size:21px;

  font-weight:900;
}

.price small{
  font-size:11px;

  color:
    var(--muted);

  font-weight:700;
}

.storeline{
  margin-top:8px;

  color:
    #dcecff;

  font-size:11px;
}

.buy{
  display:block;

  margin-top:11px;

  text-align:center;

  border:
    1px solid
    rgba(84,243,166,.5);

  border-radius:9px;

  background:
    #0c3128;

  padding:10px;

  font-size:11px;

  font-weight:900;
}

.buy.raffle{
  border-color:
    rgba(255,199,107,.55);

  background:
    #33270c;

  color:
    #fff3c8;
}

.buy.raffle.live{
  border-color:
    rgba(84,243,166,.7);

  background:
    #0c392d;

  color:white;
}

.empty{
  grid-column:
    1 / -1;

  border:
    1px dashed
    rgba(98,199,255,.25);

  border-radius:12px;

  padding:28px;

  text-align:center;

  color:
    var(--muted);
}

.store-placeholder{
  margin-top:12px;

  border:
    1px dashed
    rgba(98,199,255,.25);

  border-radius:12px;

  padding:22px;

  text-align:center;

  color:
    var(--muted);

  line-height:1.5;
}

.hidden{
  display:none!important;
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:760px){

  .tabs{
    grid-template-columns:
      repeat(
        2,
        1fr
      );
  }

  .tabs .tab:last-child{
    grid-column:
      1 / -1;
  }

  .schedule-grid{
    grid-template-columns:
      1fr;
  }

  .products{
    grid-template-columns:
      1fr;
  }

  .hero{
    height:320px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="hero"></div>


  <div class="status-wrap">

    <div
      id="backendStatus"
      class="status-pill"
    >
      <span class="dot"></span>

      <span>
        LIVE MONITOR CONNECTED
      </span>
    </div>


    <div
      id="pushStatus"
      class="status-pill offline"
      role="button"
      tabindex="0"
      aria-label="Enable push alerts"
    >
      <span class="dot"></span>

      <span>
        CHECKING PUSH ALERTS…
      </span>
    </div>

  </div>


  <!-- RETAILERS -->

  <section class="section">

    <div class="tabs">

      <button
        class="tab active"
        data-retailer="walmart"
      >
        WALMART
      </button>

      <button
        class="tab"
        data-retailer="target"
      >
        TARGET
      </button>

      <button
        class="tab"
        data-retailer="sams"
      >
        SAM'S CLUB
      </button>

      <button
        class="tab"
        data-retailer="bestbuy"
      >
        BEST BUY
      </button>

      <button
        class="tab"
        data-retailer="costco"
      >
        COSTCO
      </button>

    </div>

  </section>


  <!-- MONITOR -->

  <section class="section">

    <div
      id="retailerMonitor"
      class="monitor-panel"
    >

      <div class="panel-head">

        <div
          id="monitorTitle"
          class="panel-title"
        >
          Walmart Drop Monitor
        </div>

        <div
          id="monitorState"
          class="panel-status"
        >
          SCHEDULED
        </div>

      </div>


      <div id="walmartDetails">

        <div class="schedule-grid">

          <div class="schedule-box">

            <span>
              Drop window
            </span>

            <strong
              id="walmartSchedule"
            >
              Loading…
            </strong>

          </div>


          <div class="schedule-box">

            <span>
              Primary source
            </span>

            <strong
              id="walmartPrimary"
            >
              Loading…
            </strong>

          </div>


          <div class="schedule-box">

            <span>
              Last scheduled scan
            </span>

            <strong
              id="walmartLastScan"
            >
              —
            </strong>

          </div>


          <div class="schedule-box">

            <span>
              Next scan
            </span>

            <strong
              id="walmartNextScan"
            >
              —
            </strong>

          </div>

        </div>


        <div class="panel-actions">

          <button
            id="manualWalmartScan"
            class="action-btn"
          >
            SCAN WALMART NOW
          </button>


          <button
            id="forgetScanToken"
            class="action-btn secondary"
          >
            RESET SCAN KEY
          </button>

        </div>


        <div
          id="walmartHealth"
          class="healthline"
        >
          Provider health loading…
        </div>


        <div class="upcoming-wrap">

          <div class="upcoming-title">
            DETECTED UPCOMING + WATCHLIST
          </div>


          <div
            id="upcomingList"
            class="upcoming-list"
          >

            <div class="sub">
              Loading Walmart watchlist…
            </div>

          </div>

        </div>


        <!-- WALMART PRODUCTS / RAFFLES -->

        <div
          class="walmart-subtabs"
        >

          <button
            id="walmartProductsTab"
            class="walmart-subtab active"
          >
            PRODUCTS
          </button>

          <button
            id="walmartRafflesTab"
            class="walmart-subtab raffles"
          >
            RAFFLES
          </button>

        </div>

      </div>


      <div
        id="otherRetailerDetails"
        class="hidden"
      >

        <div
          id="otherRetailerMessage"
          class="store-placeholder"
        ></div>

      </div>

    </div>

  </section>


  <!-- SEARCH -->

  <section class="section">

    <div class="toolbar">

      <input
        id="search"
        placeholder="Search Walmart Pokémon products"
      >

      <button id="refresh">
        Refresh
      </button>

    </div>


    <div class="meta">

      <span id="visibleCount">
        0 products
      </span>

      <span id="lastUpdated">
        Not updated yet
      </span>

    </div>

  </section>


  <main
    id="products"
    class="products"
  ></main>

</div>


<script>

/* ========================================
   LABELS
======================================== */

const RETAILER_LABELS = {
  walmart:
    "Walmart",

  target:
    "Target",

  sams:
    "Sam's Club",

  bestbuy:
    "Best Buy",

  costco:
    "Costco"
};


const RETAILER_MONITOR_NAMES = {
  walmart:
    "Walmart Drop Monitor",

  target:
    "Target Online Monitor",

  sams:
    "Sam's Club Monitor",

  bestbuy:
    "Best Buy Monitor",

  costco:
    "Costco Monitor"
};


/* ========================================
   ELEMENTS
======================================== */

const productsEl =
  document.getElementById(
    "products"
  );

const searchEl =
  document.getElementById(
    "search"
  );

const refreshBtn =
  document.getElementById(
    "refresh"
  );

const backendStatus =
  document.getElementById(
    "backendStatus"
  );

const pushStatus =
  document.getElementById(
    "pushStatus"
  );

const visibleCount =
  document.getElementById(
    "visibleCount"
  );

const lastUpdated =
  document.getElementById(
    "lastUpdated"
  );

const manualWalmartScan =
  document.getElementById(
    "manualWalmartScan"
  );

const forgetScanToken =
  document.getElementById(
    "forgetScanToken"
  );

const walmartSchedule =
  document.getElementById(
    "walmartSchedule"
  );

const walmartPrimary =
  document.getElementById(
    "walmartPrimary"
  );

const walmartLastScan =
  document.getElementById(
    "walmartLastScan"
  );

const walmartNextScan =
  document.getElementById(
    "walmartNextScan"
  );

const walmartHealth =
  document.getElementById(
    "walmartHealth"
  );

const upcomingList =
  document.getElementById(
    "upcomingList"
  );

const monitorTitle =
  document.getElementById(
    "monitorTitle"
  );

const monitorState =
  document.getElementById(
    "monitorState"
  );

const walmartDetails =
  document.getElementById(
    "walmartDetails"
  );

const otherRetailerDetails =
  document.getElementById(
    "otherRetailerDetails"
  );

const otherRetailerMessage =
  document.getElementById(
    "otherRetailerMessage"
  );

const walmartProductsTab =
  document.getElementById(
    "walmartProductsTab"
  );

const walmartRafflesTab =
  document.getElementById(
    "walmartRafflesTab"
  );


/* ========================================
   STATE
======================================== */

let activeRetailer =
  "walmart";

let walmartView =
  "products";

let currentProducts =
  [];

let raffleData = {
  ok:false,
  count:0,
  items:[]
};

let providerStates =
  [];

let latestStatus =
  {};


/* ========================================
   BASIC HELPERS
======================================== */

function esc(value){

  return String(
    value ?? ""
  )
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#39;"
      })[c]
    );

}


function money(value){

  const n =
    Number(value);


  return Number.isFinite(n)
    ? new Intl.NumberFormat(
        "en-US",
        {
          style:
            "currency",

          currency:
            "USD"
        }
      )
        .format(n)

    : "Price unavailable";

}


function formatDateTime(
  value
){

  if(!value){
    return "—";
  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return String(value);
  }


  return date.toLocaleString(
    "en-US",
    {
      month:
        "numeric",

      day:
        "numeric",

      year:
        "numeric",

      hour:
        "numeric",

      minute:
        "2-digit",

      second:
        "2-digit"
    }
  );

}


function fallback(name){

  const label =
    esc(
      name ||
      "Pokémon product"
    )
      .slice(
        0,
        42
      );


  const svg =
    `<svg
      xmlns="http://www.w3.org/2000/svg"
      width="700"
      height="520"
    >

      <rect
        width="100%"
        height="100%"
        fill="#071729"
      />

      <circle
        cx="350"
        cy="210"
        r="110"
        fill="#0d3151"
      />

      <text
        x="350"
        y="205"
        text-anchor="middle"
        fill="white"
        font-size="28"
        font-family="Arial"
        font-weight="700"
      >
        ${label}
      </text>

      <text
        x="350"
        y="340"
        text-anchor="middle"
        fill="#54f3a6"
        font-size="22"
        font-family="Arial"
        font-weight="700"
      >
        POKÉMON MONITOR
      </text>

      <text
        x="350"
        y="375"
        text-anchor="middle"
        fill="#9aa9c1"
        font-size="16"
        font-family="Arial"
      >
        Retailer image unavailable
      </text>

    </svg>`;


  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg)
  );

}


/* ========================================
   BADGES
======================================== */

function statusBadge(
  status
){

  const n =
    String(
      status ||
      "out"
    )
      .toLowerCase();


  const cls =
    [
      "instock",
      "onhand",
      "live"
    ]
      .includes(n)

      ? "good"

      : [
          "transit",
          "ordered",
          "preorder",
          "upcoming",
          "watching"
        ]
          .includes(n)

        ? "warn"

        : n === "detected"

          ? "detected"

          : "out";


  const label =
    n === "instock"
      ? "IN STOCK"

      : n === "live"
        ? "RAFFLE LIVE"

      : n === "upcoming"
        ? "UPCOMING"

      : n === "detected"
        ? "EARLY DETECTED"

      : n === "closed"
        ? "CLOSED"

      : n;


  return `
    <span
      class="badge ${cls}"
    >
      ${esc(label)}
    </span>
  `;

}


/* ========================================
   PROVIDERS
======================================== */

function providerFor(
  retailer
){

  return providerStates
    .find(
      p =>
        p.retailer ===
        retailer
    ) || {

      retailer,

      label:
        RETAILER_LABELS[
          retailer
        ] ||
        retailer,

      configured:
        false,

      running:
        false,

      error:
        null,

      itemCount:
        0,

      lastRun:
        null
    };

}


/* ========================================

======================================== */

function renderUpcoming(
  watchData,
  legacyItems = []
){

  const detected =
    Array.isArray(
      watchData?.detected
    )
      ? watchData.detected

      : (
          Array.isArray(
            legacyItems
          )
            ? legacyItems
            : []
        );


  const watching =
    Array.isArray(
      watchData?.watching
    )
      ? watchData.watching
      : [];


  const rows = [];


  for(
    const item of
    detected.slice(0,8)
  ){

    rows.push(`

        class="upcoming-item"

/* ========================================
   PUSH
======================================== */

function urlBase64ToUint8Array(
  base64String
){

  const padding =
    "=".repeat(
      (
        4 -
        base64String.length %
        4
      ) %
      4
    );


  const base64 =
    (
      base64String +
      padding
    )
      .replace(
        /-/g,
        "+"
      )
      .replace(
        /_/g,
        "/"
      );


  const raw =
    atob(
      base64
    );


  return Uint8Array.from(
    [...raw]
      .map(
        ch =>
          ch.charCodeAt(0)
      )
  );

}


function setPushState(
  ok,
  text
){

  pushStatus
    .classList
    .toggle(
      "offline",
      !ok
    );


  pushStatus
    .querySelector(
      "span:last-child"
    )
    .textContent =
      text;

}


async function ensurePushSubscription(
  requestPermission = false
){

  if(
    !(
      "serviceWorker" in
      navigator
    ) ||
    !(
      "PushManager" in
      window
    ) ||
    !(
      "Notification" in
      window
    )
  ){

    setPushState(
      false,
      "PUSH NOT SUPPORTED"
    );

    return false;

  }


  if(
    requestPermission &&
    Notification.permission ===
      "default"
  ){

    const permission =
      await Notification
        .requestPermission();


    if(
      permission !==
      "granted"
    ){

      setPushState(
        false,
        "PUSH PERMISSION NEEDED"
      );

      return false;

    }

  }


  if(
    Notification.permission !==
    "granted"
  ){

    setPushState(
      false,
      "TAP TO ENABLE ALERTS"
    );

    return false;

  }


  try{

    setPushState(
      false,
      "CONNECTING ALERTS…"
    );


    const registration =
      await navigator
        .serviceWorker
        .register(
          "/sw.js",
          {
            scope:"/"
          }
        );


    await navigator
      .serviceWorker
      .ready;


    const keyResponse =
      await fetch(
        `/api/push/public-key?t=${
          Date.now()
        }`,
        {
          cache:
            "no-store"
        }
      );


    if(
      !keyResponse.ok
    ){

      throw new Error(
        "Push key unavailable"
      );

    }


    const keyData =
      await keyResponse
        .json();


    let subscription =
      await registration
        .pushManager
        .getSubscription();


    if(
      !subscription
    ){

      subscription =
        await registration
          .pushManager
          .subscribe({

            userVisibleOnly:
              true,

            applicationServerKey:
              urlBase64ToUint8Array(
                keyData.publicKey
              )

          });

    }


    const saveResponse =
      await fetch(
        "/api/push/subscribe",
        {
          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              subscription
            )
        }
      );


    if(
      !saveResponse.ok
    ){

      const details =
        await saveResponse
          .json()
          .catch(
            () => ({})
          );


      throw new Error(
        details.error ||
        "Push subscription save failed"
      );

    }


    setPushState(
      true,
      "PUSH ALERTS ACTIVE"
    );


    return true;


  }catch(error){

    console.error(
      "Push setup failed:",
      error
    );


    setPushState(
      false,
      "TAP TO RETRY ALERTS"
    );


    return false;

  }

}


async function initializePush(){

  if(
    Notification.permission ===
    "granted"
  ){

    await ensurePushSubscription(
      false
    );

  }else if(
    Notification.permission ===
    "denied"
  ){

    setPushState(
      false,
      "PUSH BLOCKED IN SETTINGS"
    );

  }else{

    setPushState(
      false,
      "TAP TO ENABLE ALERTS"
    );

  }

}

async function fetchRetailerProducts(){

  const response =
    await fetch(
      `/api/products?retailer=${
        encodeURIComponent(
          activeRetailer
        )
      }&t=${
        Date.now()
      }`,
      {
        cache:
          "no-store"
      }
    );


  if(
    !response.ok
  ){

    throw new Error(
      `${
        RETAILER_LABELS[
          activeRetailer
        ]
      } inventory request failed`
    );

  }


  const data =
    await response.json();


  currentProducts =
    Array.isArray(
      data.items
    )
      ? data.items
      : [];

}


async function fetchWalmartRaffles(){

  try{

    const response =
      await fetch(
        `/api/walmart/raffles?t=${
          Date.now()
        }`,
        {
          cache:
            "no-store"
        }
      );


    if(
      !response.ok
    ){
      throw new Error(
        "Raffle request failed"
      );
    }


    const data =
      await response.json();


    raffleData = {
      ...data,

      items:
        Array.isArray(
          data.items
        )
          ? data.items
          : []
    };


  }catch(error){

    console.error(
      "Raffle fetch failed:",
      error
    );


    raffleData = {
      ...raffleData,

      ok:false,

      error:
        error.message
    };

  }

}


/* ========================================
   MAIN LOAD
======================================== */

async function load(){

  refreshBtn.disabled =
    true;


  try{

    const [
      providersResponse,
      statusResponse
    ] =
      await Promise.all([

        fetch(
          `/api/providers?t=${
            Date.now()
          }`,
          {
            cache:
              "no-store"
          }
        ),

        fetch(
          `/api/status?t=${
            Date.now()
          }`,
          {
            cache:
              "no-store"
          }
        )

      ]);


    if(
      !providersResponse.ok ||
      !statusResponse.ok
    ){

      throw new Error(
        "Backend request failed"
      );

    }


    const [
      providersData,
      statusData
    ] =
      await Promise.all([

        providersResponse.json(),

        statusResponse.json()

      ]);


    providerStates =
      Array.isArray(
        providersData.providers
      )
        ? providersData.providers
        : [];


    latestStatus =
      statusData ||
      {};


    await fetchRetailerProducts();


    if(
      activeRetailer ===
      "walmart"
    ){
      await fetchWalmartRaffles();
    }


    renderMonitor();
    renderProducts();


    setOnline(
      backendStatus,
      true,

      "LIVE MONITOR CONNECTED",

      "MONITOR CONNECTION ERROR"
    );


    if(
      !statusData
        ?.push
        ?.configured
    ){

      setPushState(
        false,
        "PUSH SERVER NOT CONFIGURED"
      );

    }


    lastUpdated.textContent =
      `Updated ${
        new Date()
          .toLocaleTimeString()
      }`;


  }catch(error){

    console.error(
      error
    );


    setOnline(
      backendStatus,
      false,

      "LIVE MONITOR CONNECTED",

      "MONITOR CONNECTION ERROR"
    );


  }finally{

    refreshBtn.disabled =
      false;

  }

}

   RETAILER SWITCHING
======================================== */

async function switchRetailer(
  retailer
){

  activeRetailer =
    retailer;


  if(
    retailer !==
    "walmart"
  ){
    walmartView =
      "products";
  }


  searchEl.value =
    "";


  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      tab => {

        tab.classList
          .toggle(
            "active",

            tab.dataset.retailer ===
            retailer
          );

      }
    );


  currentProducts =
    [];


  renderMonitor();
  renderProducts();


  await load();

}


/* ========================================
   WALMART VIEW SWITCHING
======================================== */

function switchWalmartView(
  view
){

  if(
    activeRetailer !==
    "walmart"
  ){
    return;
  }


  walmartView =
    view;


  searchEl.value =
    "";


  renderMonitor();
  renderProducts();

}


/* ========================================
   MANUAL WALMART SCAN
======================================== */

async function runManualWalmartScan(){

  let token =
    localStorage
      .getItem(
        "pokemonMonitorScanToken"
      ) ||
    "";


  if(!token){

    token =
      prompt(
        "Enter your MANUAL_SCAN_TOKEN from Render:"
      ) ||
      "";


    if(!token){
      return;
    }


    localStorage
      .setItem(
        "pokemonMonitorScanToken",
        token
      );

  }


  manualWalmartScan.disabled =
    true;


  manualWalmartScan.textContent =
    "SCANNING…";


  try{

    const response =
      await fetch(
        "/api/walmart/scan",
        {
          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-monitor-token":
              token
          },

          body:
            "{}"
        }
      );


    const data =
      await response
        .json();


    if(
      response.status ===
      401
    ){

      localStorage
        .removeItem(
          "pokemonMonitorScanToken"
        );


      alert(
        "Scan key was rejected. Tap SCAN WALMART NOW and enter it again."
      );


      return;

    }


    if(
      !response.ok
    ){

      throw new Error(
        data.error ||
        data.result?.reason ||
        "Manual scan failed"
      );

    }


    alert(
      data.result?.skipped

        ? data.result.reason

        : "Walmart scan completed."
    );


    await load();


  }catch(error){

    alert(
      error.message
    );


  }finally{

    manualWalmartScan.disabled =
      false;


    manualWalmartScan.textContent =
      "SCAN WALMART NOW";

  }

}


/* ========================================
   EVENTS
======================================== */

document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    button => {

      button
        .addEventListener(
          "click",
          () =>
            switchRetailer(
              button.dataset.retailer
            )
        );

    }
  );


walmartProductsTab
  .addEventListener(
    "click",
    () =>
      switchWalmartView(
        "products"
      )
  );


walmartRafflesTab
  .addEventListener(
    "click",
    () =>
      switchWalmartView(
        "raffles"
      )
  );


searchEl
  .addEventListener(
    "input",
    renderProducts
  );


refreshBtn
  .addEventListener(
    "click",
    load
  );


manualWalmartScan
  .addEventListener(
    "click",
    runManualWalmartScan
  );


forgetScanToken
  .addEventListener(
    "click",
    () => {

      localStorage
        .removeItem(
          "pokemonMonitorScanToken"
        );


      alert(
        "Saved scan key cleared."
      );

    }
  );


pushStatus
  .addEventListener(
    "click",
    () =>
      ensurePushSubscription(
        true
      )
  );


pushStatus
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
          "Enter" ||
        event.key ===
          " "
      ){

        event.preventDefault();


        ensurePushSubscription(
          true
        );

      }

    }
  );


/* ========================================
   AUTO REFRESH
======================================== */

setInterval(
  load,
  15000
);


load();
initializePush();

</script>

</body>
</html>
