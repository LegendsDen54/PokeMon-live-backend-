<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#020711"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<title>Pokémon Restock Monitor</title>

<style>

:root{
  --bg:#020711;
  --panel:#071326;
  --panel2:#0a1b31;
  --text:#f7fbff;
  --muted:#96a8bf;
  --green:#54f3a6;
  --blue:#62c7ff;
  --gold:#ffc76b;
  --red:#ff758b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:max(24px, env(safe-area-inset-bottom));
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.app{
  max-width:980px;
  margin:auto;
  overflow:hidden;
}

.hero{
  height:360px;
  background:
    linear-gradient(
      to bottom,
      rgba(2,7,17,0) 58%,
      rgba(2,7,17,.35) 76%,
      var(--bg) 100%
    ),
    url("hero.jpg")
      center top /
      cover
      no-repeat;
}

.status-wrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  padding:0 14px;
  margin-top:-28px;
  position:relative;
  z-index:2;
}

.status-pill{
  min-height:46px;
  border:1px solid rgba(84,243,166,.55);
  border-radius:12px;
  background:rgba(8,44,37,.96);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:12px;
  font-weight:900;
}

.status-pill.offline{
  border-color:rgba(255,117,139,.55);
  background:rgba(57,19,29,.96);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
}

.offline .dot{
  background:var(--red);
  box-shadow:0 0 8px var(--red);
}

.section{
  padding:12px 14px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:7px;
}

.tab{
  border:1px solid rgba(98,199,255,.25);
  border-radius:10px;
  background:var(--panel);
  color:#dcecff;
  padding:11px 6px;
  font-size:11px;
  font-weight:900;
}

.tab.active{
  border-color:var(--green);
  background:#0d2f2a;
  color:white;
}

.provider-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.provider{
  border:1px solid rgba(98,199,255,.2);
  border-radius:12px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  padding:10px;
}

.provider-name{
  font-size:12px;
  font-weight:900;
}

.provider-state{
  margin-top:6px;
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
}

.provider-state strong{
  color:white;
}

.toolbar{
  display:flex;
  gap:8px;
  align-items:center;
}

.toolbar input{
  flex:1;
  min-width:0;
  background:var(--panel);
  border:1px solid rgba(98,199,255,.25);
  color:white;
  border-radius:10px;
  padding:12px;
}

.toolbar button{
  border:1px solid rgba(84,243,166,.45);
  background:#0b2b25;
  color:#e9fff5;
  border-radius:10px;
  padding:12px 16px;
  font-weight:900;
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  padding:4px 14px 20px;
}

.card{
  border:1px solid rgba(98,199,255,.18);
  border-radius:14px;
  background:linear-gradient(180deg,#09192d,#06111f);
  overflow:hidden;
}

.image-wrap{
  aspect-ratio:1.35 / 1;
  background:#08111e;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.image-wrap img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.image-note{
  position:absolute;
  bottom:7px;
  left:7px;
  background:rgba(2,7,17,.8);
  border:1px solid rgba(255,255,255,.14);
  border-radius:6px;
  padding:4px 6px;
  font-size:9px;
  font-weight:900;
}

.body{
  padding:12px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.badge{
  display:inline-flex;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.18);
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}

.badge.good{
  border-color:rgba(84,243,166,.5);
  color:var(--green);
}

.badge.warn{
  border-color:rgba(255,199,107,.5);
  color:var(--gold);
}

.badge.out{
  border-color:rgba(255,117,139,.5);
  color:var(--red);
}

.name{
  margin-top:9px;
  font-size:15px;
  font-weight:900;
  line-height:1.3;
}

.sub{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.price{
  margin-top:10px;
  font-size:21px;
  font-weight:900;
}

.price small{
  font-size:11px;
  color:var(--muted);
  font-weight:700;
}

.storeline{
  margin-top:8px;
  color:#dcecff;
  font-size:11px;
}

.buy{
  display:block;
  margin-top:11px;
  text-align:center;
  border:1px solid rgba(84,243,166,.5);
  border-radius:9px;
  background:#0c3128;
  padding:10px;
  font-size:11px;
  font-weight:900;
}

.empty{
  grid-column:1 / -1;
  border:1px dashed rgba(98,199,255,.25);
  border-radius:12px;
  padding:28px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:760px){

  .tabs{
    grid-template-columns:repeat(3,1fr);
  }

  .provider-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .products{
    grid-template-columns:1fr;
  }

  .hero{
    height:320px;
  }

}

</style>

</head>

<body>

<div class="app">

  <div class="hero"></div>

  <div class="status-wrap">

    <div id="backendStatus" class="status-pill">
      <span class="dot"></span>
      <span>LIVE MONITOR CONNECTED</span>
    </div>

    <div id="pushStatus" class="status-pill">
      <span class="dot"></span>
      <span>PUSH ALERTS ACTIVE</span>
    </div>

  </div>

  <section class="section">

    <div class="tabs">

      <button class="tab active" data-retailer="all">
        ALL
      </button>

      <button class="tab" data-retailer="walmart">
        WALMART
      </button>

      <button class="tab" data-retailer="target">
        TARGET
      </button>

      <button class="tab" data-retailer="sams">
        SAM'S CLUB
      </button>

      <button class="tab" data-retailer="bestbuy">
        BEST BUY
      </button>

      <button class="tab" data-retailer="costco">
        COSTCO
      </button>

    </div>

  </section>

  <section class="section">
    <div id="providers" class="provider-grid"></div>
  </section>

  <section class="section">

    <div class="toolbar">

      <input
        id="search"
        placeholder="Search Pokémon products"
      >

      <button id="refresh">
        Refresh
      </button>

    </div>

    <div class="meta">

      <span id="visibleCount">
        0 products
      </span>

      <span id="lastUpdated">
        Not updated yet
      </span>

    </div>

  </section>

  <main id="products" class="products"></main>

</div>

<script>

const RETAILER_LABELS = {
  walmart:"Walmart",
  target:"Target",
  sams:"Sam's Club",
  bestbuy:"Best Buy",
  costco:"Costco"
};

const productsEl =
  document.getElementById("products");

const providersEl =
  document.getElementById("providers");

const searchEl =
  document.getElementById("search");

const refreshBtn =
  document.getElementById("refresh");

const backendStatus =
  document.getElementById("backendStatus");

const pushStatus =
  document.getElementById("pushStatus");

const visibleCount =
  document.getElementById("visibleCount");

const lastUpdated =
  document.getElementById("lastUpdated");

let activeRetailer = "all";
let allProducts = [];
let providerStates = [];

function esc(value){
  return String(value ?? "")
    .replace(/[&<>"']/g, character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#39;"
    })[character]);
}

function money(value){

  const number = Number(value);

  return Number.isFinite(number)
    ? new Intl.NumberFormat(
        "en-US",
        {
          style:"currency",
          currency:"USD"
        }
      ).format(number)
    : "Price unavailable";
}

function fallback(name){

  const label =
    esc(name || "Pokémon product")
      .slice(0,42);

  const svg = `
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="700"
      height="520"
    >
      <rect
        width="100%"
        height="100%"
        fill="#071729"
      />

      <circle
        cx="350"
        cy="210"
        r="110"
        fill="#0d3151"
      />

      <text
        x="350"
        y="205"
        text-anchor="middle"
        fill="white"
        font-size="28"
        font-family="Arial"
        font-weight="700"
      >
        ${label}
      </text>

      <text
        x="350"
        y="340"
        text-anchor="middle"
        fill="#54f3a6"
        font-size="22"
        font-family="Arial"
        font-weight="700"
      >
        REPRESENTATIVE IMAGE
      </text>

      <text
        x="350"
        y="375"
        text-anchor="middle"
        fill="#9aa9c1"
        font-size="16"
        font-family="Arial"
      >
        Retailer image unavailable
      </text>
    </svg>
  `;

  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg)
  );
}

function statusBadge(status){

  const normalized =
    String(status || "out")
      .toLowerCase();

  const className =
    ["instock","onhand"].includes(normalized)
      ? "good"
      : ["transit","ordered","preorder"].includes(normalized)
        ? "warn"
        : "out";

  return `
    <span class="badge ${className}">
      ${esc(normalized)}
    </span>
  `;
}

function providerCard(provider){

  const state =
    provider.configured
      ? provider.error
        ? `ERROR: ${esc(provider.error)}`
        : provider.running
          ? "SCANNING"
          : "CONNECTED"
      : "NOT CONFIGURED";

  return `
    <div class="provider">

      <div class="provider-name">
        ${esc(provider.label)}
      </div>

      <div class="provider-state">

        <strong>
          ${state}
        </strong>

        <br>

        Last scan:
        ${
          provider.lastRun
            ? new Date(provider.lastRun).toLocaleTimeString()
            : "—"
        }

        <br>

        Live products:
        ${Number(provider.itemCount || 0)}

      </div>

    </div>
  `;
}

function renderProviders(){

  providersEl.innerHTML =
    providerStates
      .map(providerCard)
      .join("");
}

function renderProducts(){

  const query =
    searchEl
      .value
      .trim()
      .toLowerCase();

  const list =
    allProducts.filter(product => {

      const retailerMatch =
        activeRetailer === "all" ||
        product.retailer === activeRetailer;

      const searchMatch =
        !query ||

        String(product.name)
          .toLowerCase()
          .includes(query) ||

        String(product.seller || "")
          .toLowerCase()
          .includes(query) ||

        String(product.storeName || "")
          .toLowerCase()
          .includes(query);

      return retailerMatch && searchMatch;
    });

  visibleCount.textContent =
    `${list.length} product${list.length === 1 ? "" : "s"}`;

  if(!list.length){

    productsEl.innerHTML = `
      <div class="empty">
        No live inventory returned for this view.
        Unconfigured retailers intentionally remain empty.
      </div>
    `;

    return;
  }

  productsEl.innerHTML =
    list.map(product => {

      const fallbackImage =
        fallback(product.name);

      const image =
        product.image ||
        fallbackImage;

      const channel =
        product.channel === "store"
          ? "IN-STORE"
          : "ONLINE";

      const store =
        product.channel === "store"
          ? `
            <div class="storeline">

              Store:
              ${
                esc(
                  product.storeName ||
                  "Unknown store"
                )
              }

              ${
                product.storeId
                  ? ` • ID ${esc(product.storeId)}`
                  : ""
              }

              ${
                product.quantity != null
                  ? ` • Qty ${esc(product.quantity)}`
                  : ""
              }

            </div>
          `
          : "";

      return `
        <article class="card">

          <div class="image-wrap">

            <img
              src="${esc(image)}"
              alt="${esc(product.name)}"
              onerror="
                this.onerror=null;
                this.src='${fallbackImage}'
              "
            >

            <div class="image-note">
              ${
                product.image
                  ? "RETAILER IMAGE"
                  : "REPRESENTATIVE IMAGE"
              }
            </div>

          </div>

          <div class="body">

            <div class="badges">

              ${statusBadge(product.status)}

              <span class="badge">
                ${channel}
              </span>

              <span class="badge">
                ${
                  esc(
                    product.retailerLabel ||
                    RETAILER_LABELS[product.retailer] ||
                    product.retailer
                  )
                }
              </span>

            </div>

            <div class="name">
              ${esc(product.name)}
            </div>

            <div class="sub">
              Seller:
              ${
                esc(
                  product.seller ||
                  "Not provided"
                )
              }
            </div>

            <div class="price">

              ${money(product.price)}

              <small>
                ${
                  product.msrp != null
                    ? `MSRP ${money(product.msrp)}`
                    : ""
                }
              </small>

            </div>

            ${store}

            <div class="sub">

              Checked:
              ${
                product.checkedAt
                  ? new Date(
                      product.checkedAt
                    ).toLocaleTimeString()
                  : "—"
              }

              ${
                product.rawStatus
                  ? ` • Source status: ${esc(product.rawStatus)}`
                  : ""
              }

            </div>

            ${
              product.url
                ? `
                  <a
                    class="buy"
                    href="${esc(product.url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    OPEN PRODUCT
                  </a>
                `
                : ""
            }

          </div>

        </article>
      `;

    }).join("");
}

function setOnline(
  element,
  ok,
  onText,
  offText
){

  element.classList.toggle(
    "offline",
    !ok
  );

  element
    .querySelector("span:last-child")
    .textContent =
      ok
        ? onText
        : offText;
}

async function load(){

  refreshBtn.disabled = true;

  try{

    const [
      productsResponse,
      providersResponse,
      statusResponse
    ] =
      await Promise.all([

        fetch(
          `/api/products?t=${Date.now()}`,
          {
            cache:"no-store"
          }
        ),

        fetch(
          `/api/providers?t=${Date.now()}`,
          {
            cache:"no-store"
          }
        ),

        fetch(
          `/api/status?t=${Date.now()}`,
          {
            cache:"no-store"
          }
        )

      ]);

    if(
      !productsResponse.ok ||
      !providersResponse.ok ||
      !statusResponse.ok
    ){
      throw new Error(
        "Backend request failed"
      );
    }

    const [
      productsData,
      providersData,
      statusData
    ] =
      await Promise.all([

        productsResponse.json(),
        providersResponse.json(),
        statusResponse.json()

      ]);

    allProducts =
      Array.isArray(productsData.items)
        ? productsData.items
        : [];

    providerStates =
      Array.isArray(providersData.providers)
        ? providersData.providers
        : [];

    renderProviders();
    renderProducts();

    setOnline(
      backendStatus,
      true,
      "LIVE MONITOR CONNECTED",
      "MONITOR CONNECTION ERROR"
    );

    setOnline(
      pushStatus,
      Boolean(
        statusData
          ?.push
          ?.configured
      ),
      "PUSH ALERTS ACTIVE",
      "PUSH ALERTS NOT ACTIVE"
    );

    lastUpdated.textContent =
      `Updated ${
        new Date().toLocaleTimeString()
      }`;

  }catch(error){

    console.error(error);

    setOnline(
      backendStatus,
      false,
      "LIVE MONITOR CONNECTED",
      "MONITOR CONNECTION ERROR"
    );

  }finally{

    refreshBtn.disabled = false;

  }
}

document
  .querySelectorAll(".tab")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".tab")
          .forEach(
            tab =>
              tab
                .classList
                .remove("active")
          );

        button
          .classList
          .add("active");

        activeRetailer =
          button.dataset.retailer;

        renderProducts();
      }
    );

  });

searchEl.addEventListener(
  "input",
  renderProducts
);

refreshBtn.addEventListener(
  "click",
  load
);

setInterval(
  load,
  15000
);

load();

</script>

</body>

</html>
